name: Deploy to GitHub Pages

# config.js is gitignored, so it is generated here from repository secrets.
# The keys still reach the browser at runtime — that is unavoidable for a static
# site — but they never live in the repository or its history. What actually
# protects them is firestore.rules and the Maps key referrer restriction.

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you redeploy by hand after changing a secret

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Write config.js from secrets
        env:
          # Secrets — Settings → Secrets and variables → Actions
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID:  ${{ secrets.FIREBASE_APP_ID }}
          MAPS_API_KEY:     ${{ secrets.MAPS_API_KEY }}
          ALLOWED_EMAILS:   ${{ secrets.ALLOWED_EMAILS }}   # comma separated
          API_BASE:         ${{ secrets.API_BASE }}         # scraper URL, not a secret but env-specific
          # Public identifiers, no need to hide these
          FIREBASE_PROJECT_ID: apartment-hunter-41fd6
          DEFAULT_CITY: Kraków
          DEFAULT_REGION: pl
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::One or more secrets are unset — the deployed page will ask for the keys via its Keys button."
          fi
          cat > _site/config.js <<EOF
          /* Generated by .github/workflows/deploy.yml — do not edit. */
          window.APP_CONFIG = {
            firebase: {
              apiKey:            "${FIREBASE_API_KEY}",
              authDomain:        "${FIREBASE_PROJECT_ID}.firebaseapp.com",
              projectId:         "${FIREBASE_PROJECT_ID}",
              storageBucket:     "${FIREBASE_PROJECT_ID}.firebasestorage.app",
              messagingSenderId: "1085228370812",
              appId:             "${FIREBASE_APP_ID}"
            },
            mapsApiKey: "${MAPS_API_KEY}",
            allowedEmails: "${ALLOWED_EMAILS}",
            apiBase: "${API_BASE}",
            defaultCity: "${DEFAULT_CITY}",
            defaultRegion: "${DEFAULT_REGION}"
          };
          EOF
          node --check _site/config.js && echo "config.js is valid JavaScript"

      - name: Fail if a key leaked into the committed source
        run: |
          # Real Google API keys are AIzaSy + 33 more chars. Matching the bare
          # prefix would flag the placeholder text in the page's own Keys dialog.
          if git ls-files | xargs grep -lE 'AIzaSy[0-9A-Za-z_-]{30,}' 2>/dev/null; then
            echo "::error::An API key is present in a tracked file. Remove it before deploying."
            exit 1
          fi
          if git ls-files | grep -qx 'config.js'; then
            echo "::error::config.js is tracked — run: git rm --cached config.js"
            exit 1
          fi
          echo "No API keys in tracked files."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
