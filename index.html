    out.notes = 'Auto-filled from OLX. Check kaucja and provision.';
  }
  return JSON.stringify(out);
})()`;

/* ================================================== auth + server state
   Firebase is now only an identity provider: it issues the ID token the API
   verifies. All data lives in Postgres. Local storage is a read-only mirror so
   the page still opens and scores when the server is unreachable.          */
const FB_VERS = ["10.14.1", "11.0.2", "10.12.5"];
const FB = {app:null, auth:null, uid:null, email:null, ready:false};
const UI = {hiddenModes: []};
let saveTimer = null, dirty = new Set();
// The last failure, kept so the pill can explain itself rather than saying
// "offline" for a 500, a CORS block and a dead network alike.
let LAST_ERROR = null;

function fbConf(){
  const c = Object.assign({}, CFG.firebase||{});
  try{ const ov = JSON.parse(localStorage.getItem("ah-firebase")||"null"); if(ov) Object.assign(c, ov); }
  catch(e){}
  return (c.apiKey && c.appId && c.projectId) ? c : null;
}
function setSync(state, text){
  const el = $("#syncPill"); if(!el) return;
  el.className = "sync" + (state ? " "+state : "");
  el.textContent = text;
  el.style.cursor = state === "err" ? "pointer" : "";
  el.title = state === "err" && LAST_ERROR
    ? `${LAST_ERROR.status} on ${LAST_ERROR.path}\n${LAST_ERROR.message}\nClick to see details and retry.`
    : "Sync status";
  if(state === "ok" || state === "busy") LAST_ERROR = null;
}

function showSyncProblem(){
  if(!LAST_ERROR){
    dialog("Sync", `<div class="note">Everything is talking to the server normally.</div>`,
      [{label:"Close", primary:true}]);
    return;
  }
  const e = LAST_ERROR;
  const hint =
    e.status === "network"
      ? `The browser could not reach the API at all. Usually one of: the server is down,
         <code>apiBase</code> in config.js points somewhere wrong, or the origin
         <code>${esc(location.origin)}</code> is missing from <code>CORS_ORIGINS</code>
         in the server's .env.`
    : e.status === 401 ? "The server rejected the sign-in token. Try signing out and back in."
    : e.status === 403 ? `This account is not in <code>ALLOWED_EMAILS</code> on the server.`
    : `The server returned an error. Check <code>docker compose logs scraper</code> —
       the response body is below and the container log will have the traceback.`;
  dialog("Could not load from the server", `
    <div class="note warn">${hint}</div>
    <table class="fieldtable">
      <tr><td class="k">When</td><td class="v">${esc(e.when)}</td></tr>
      <tr><td class="k">Request</td><td class="v mono">${esc(e.path)}</td></tr>
      <tr><td class="k">Status</td><td class="v">${esc(String(e.status))}</td></tr>
      <tr><td class="k">Message</td><td class="v">${esc(e.message)}</td></tr>
      <tr><td class="k">Showing cached data</td><td class="v">${e.cached ? "yes" : "no"}</td></tr>
    </table>
    <div class="tiny" style="margin-top:10px">Editing is disabled while this persists, so a
      change made here cannot be lost against a database it never reached.</div>`,
    [{label:"Close"}, {label:"Retry now", primary:true, act: pullAll}]);
}
function uiWrite(){
  try{ localStorage.setItem("ah-ui", JSON.stringify(UI)); }catch(e){}
}
function uiRead(){
  try{ Object.assign(UI, JSON.parse(localStorage.getItem("ah-ui")||"{}")); }catch(e){}
}

async function initFirebase(){
  const conf = fbConf();
  if(!conf){ setSync("", "no sign-in configured"); return; }
  try{
    setSync("busy","connecting…");
    let mods = null, lastErr = null;
    for(const v of FB_VERS){
      try{
        mods = await Promise.all([
          import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
          import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`)
        ]);
        break;
      }catch(e){ lastErr = e; console.warn("Firebase SDK "+v+" unavailable", e); }
    }
    if(!mods) throw new Error("could not load the Firebase SDK — "+(lastErr?.message||""));
    const [{initializeApp}, authMod] = mods;
    FB.app = initializeApp(conf);
    FB.auth = authMod.getAuth(FB.app);
    FB.mods = {auth: authMod};
    FB.ready = true;
    authMod.onAuthStateChanged(FB.auth, onAuth);
  }catch(e){ console.error(e); setSync("err","sign-in unavailable"); }
}

async function onAuth(u){
  if(!u){
    FB.uid = null; FB.email = null; ONLINE = false; READONLY = true;
    $("#bAcct").textContent = "Sign in";
    setSync("", "not signed in");
    initMap(); render();
    return;
  }
  FB.uid = u.uid; FB.email = u.email || "";
  $("#bAcct").textContent = (u.displayName||u.email||"Account").split(" ")[0];
  await pullAll();
  initMap();
}

/* --- API ----------------------------------------------------------------- */
const API = (CFG.apiBase || "").replace(/\/$/, "");
async function idToken(){
  if(!FB.ready || !FB.uid) return null;
  try{ return await FB.auth.currentUser.getIdToken(); }catch(e){ return null; }
}
async function api(path, opts = {}){
  if(!API) throw new Error("no server configured — set apiBase in config.js");
  const tok = await idToken();
  if(!tok) throw new Error("sign in first");
  let r;
  try{
    r = await fetch(API + path, Object.assign({}, opts, {
      headers: Object.assign({"Content-Type":"application/json",
                              "Authorization":"Bearer " + tok}, opts.headers||{})
    }));
  }catch(netErr){
    // fetch only rejects for network/CORS failures; everything else is a status
    const e = new Error(`could not reach ${API + path} — ${netErr.message}`);
    e.path = path; e.network = true;
    throw e;
  }
  let body = null;
  try{ body = await r.json(); }catch(e){}
  if(!r.ok){
    const d = body?.detail;
    const err = new Error(typeof d === "string" ? d : (d?.reason || `${r.status} ${r.statusText}`));
    err.status = r.status; err.body = body; err.path = path;
    throw err;
  }
  return body;
}
const apiSchema = (method, path, body) =>
  api(path, {method, body: body === undefined ? undefined : JSON.stringify(body)});

async function loadSchema(){
  const d = await api("/api/schema");
  SCHEMA.categories = d.categories || [];
  SCHEMA.criteria   = d.criteria || [];
  SCHEMA.places     = d.places || [];
  SCHEMA.settings   = Object.assign({}, FALLBACK_SETTINGS, d.settings || {});
  return d;
}
async function putSettings(patch){
  Object.assign(SCHEMA.settings, patch);
  try{
    SCHEMA.settings = Object.assign({}, FALLBACK_SETTINGS,
      await apiSchema("PUT", "/api/admin/settings", patch));
  }catch(e){ console.warn("settings not saved", e); }
  cacheWrite(); MAP.routeSig = null; render();
}

/* Server rows use `answers`; the page also keeps address/link/notes at the top
   level because the map, the list and the print sheet all reach for them. */
function fromRow(r){
  return {id:r.ext_id, address:r.address, link:r.link, notes:r.notes,
          lat:r.lat, lon:r.lon, photos:r.photos||[], answers:r.answers||{},
          travel:r.travel||{}, scrape:r.scrape||null,
          status_override:r.status_override||"", archived:!!r.archived,
          updatedAt:r.client_updated_at||0};
}
function toRow(c){
  const a = Object.assign({}, c.answers||{});
  if(c.address!=null) a.address = c.address;
  if(c.link!=null) a.link = c.link;
  if(c.notes!=null) a.notes = c.notes;
  return {ext_id:c.id, address:c.address||null, link:c.link||null, notes:c.notes||null,
          lat:c.lat??null, lon:c.lon??null, photos:c.photos||[], answers:a,
          travel:c.travel||{}, scrape:c.scrape||null,
          status_override:c.status_override||null, archived:!!c.archived,
          client_updated_at:c.updatedAt||Date.now()};
}

async function pullAll(){
  setSync("busy","loading…");
  try{
    await loadSchema();
    const d = await api("/api/candidates");
    S.candidates = (d.candidates||[]).map(fromRow);
    if(!S.candidates.find(c=>c.id===selId)) selId = S.candidates[0]?.id ?? null;
    ONLINE = true; READONLY = false;
    cacheWrite();
    setSync("ok","synced");
  }catch(e){
    ONLINE = false; READONLY = true;
    const cached = cacheRead();
    LAST_ERROR = {
      when: new Date().toLocaleTimeString(),
      path: e.path || "?", status: e.status || (e.network ? "network" : "?"),
      message: e.message, cached
    };
    setSync("err", e.status === 403 ? "not allowed"
                 : e.status === 401 ? "sign-in rejected"
                 : e.status ? `server error ${e.status}`
                 : "cannot reach server");
    console.error("[apartment-hunter] load failed on " + (e.path||"?") + ":", e);
  }
  render();
}

/* --- writes -------------------------------------------------------------- */
function touch(c){ if(c) c.updatedAt = Date.now(); }
/* save(candidate) — always pass the row you touched.
   It used to mark whatever was *selected* dirty, so a background write (the
   auto-calculate after a scrape, or route drawing on another flat) flagged the
   wrong row and the real edit was never sent. */
function save(c){
  cacheWrite();
  if(READONLY){ setSync("err","read-only — server unreachable"); return; }
  const target = c || S.candidates.find(x=>x.id===selId);
  if(target) dirty.add(target.id);
  if(!dirty.size) return;
  setSync("busy","saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
function saveLocal(){ cacheWrite(); }
async function saveNow(c){
  if(c) dirty.add(c.id);
  await flush();
}
let flushing = false, retryTimer = null, retryDelay = 2000;

async function flush(){
  if(READONLY || flushing || !dirty.size) return;
  flushing = true;
  // Take them one at a time and only clear on success, so a failure halfway
  // through cannot drop the rows that had not been sent yet.
  const failed = [];
  try{
    for(const id of [...dirty]){
      const c = S.candidates.find(x=>x.id===id);
      if(!c){ dirty.delete(id); continue; }
      try{
        await api("/api/candidates/"+encodeURIComponent(id),
                  {method:"PUT", body: JSON.stringify(toRow(c))});
        dirty.delete(id);
      }catch(e){
        if(e.status === 409 && e.body?.detail?.current){
          // Somebody else saved a newer version. Take theirs rather than
          // overwrite it — silently losing an edit is worse than a surprise.
          const row = fromRow(e.body.detail.current);
          const i = S.candidates.findIndex(x=>x.id===row.id);
          if(i >= 0) S.candidates[i] = row;
          dirty.delete(id);
          setSync("err","newer version on the server — reloaded");
          render();
          continue;
        }
        failed.push({id, e});
        console.error("[apartment-hunter] save failed for " + id, e);
      }
    }
  } finally { flushing = false; }

  cacheWrite();

  if(!failed.length){
    setSync("ok","synced");
    retryDelay = 2000;
    return;
  }
  // Anything still dirty is retried with backoff. Without this a failed save
  // sat in the queue until some unrelated edit happened to trigger a flush,
  // which is how a candidate ended up half-written to the database.
  const first = failed[0].e;
  LAST_ERROR = {when:new Date().toLocaleTimeString(), path:first.path || "PUT /api/candidates",
                status:first.status || (first.network ? "network" : "?"),
                message:first.message, cached:true};
  setSync("err", `${failed.length} unsaved — retrying`);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(flush, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 30000);
}

/* Don't let a page close swallow pending edits silently. */
window.addEventListener("beforeunload", e => {
  if(dirty.size && !READONLY){ e.preventDefault(); e.returnValue = ""; }
});

async function removeCandidate(c){
  S.candidates = S.candidates.filter(x=>x.id!==c.id);
  selId = S.candidates[0]?.id ?? null;
  cacheWrite(); render();
  try{ await api("/api/candidates/"+encodeURIComponent(c.id), {method:"DELETE"}); }
  catch(e){ setSync("err","delete failed"); console.error(e); }
}

/* ================================================== map + routes
   One map for the whole search: every geocoded candidate is a pin, clicking a
   pin selects it and draws its routes. Base map is deliberately desaturated —
   Google's own cycle-path network is dense enough to bury a route line. */
const MAP = {map:null, pins:{}, placePins:[], renderers:[], labels:[],
             routeSig:null, ready:false, cache:new Map()};
const ROUTE_COLOR = {BICYCLING:"#1f9254", TRANSIT:"#1f5fd0", WALKING:"#a8730a", DRIVING:"#b04a12"};

/* Muted base style so the routes are the loudest thing on the map. */
const MAP_STYLE = [
  {elementType:"labels.icon", stylers:[{visibility:"off"}]},
  {featureType:"poi", stylers:[{visibility:"off"}]},
  {featureType:"poi.park", elementType:"geometry",
   stylers:[{color:"#e8efe6"},{saturation:-40}]},
  {featureType:"landscape", elementType:"geometry",
   stylers:[{color:"#f6f7f8"}]},
  {featureType:"landscape.natural", elementType:"geometry",
   stylers:[{color:"#eef1ec"},{saturation:-45}]},
  {featureType:"road", elementType:"geometry", stylers:[{saturation:-70},{lightness:22}]},
  {featureType:"road", elementType:"labels", stylers:[{lightness:35}]},
  {featureType:"road.highway", elementType:"geometry",
   stylers:[{color:"#e6e2dc"},{saturation:-60}]},
  {featureType:"transit", stylers:[{visibility:"simplified"},{saturation:-60},{lightness:30}]},
  {featureType:"transit.line", elementType:"geometry",
   stylers:[{color:"#dfe3e8"},{saturation:-80}]},
  {featureType:"water", elementType:"geometry", stylers:[{color:"#d9e6ef"},{saturation:-25}]},
  {featureType:"administrative", elementType:"geometry", stylers:[{lightness:40}]}
];

/* Transit times depend on when you leave, so pin them to a repeatable moment
   rather than "now" — otherwise a score quietly changes at rush hour. Google
   also rejects transit requests with a departure time in the past. */
function departAt(place){
  const hour = Number(place?.departHour ?? P().departHour ?? 10);
  const d = new Date();
  d.setHours(Math.floor(hour), Math.round((hour % 1) * 60), 0, 0);
  if(d <= new Date()) d.setDate(d.getDate() + 1);
  while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);  // next weekday
  return d;
}
function routeOpts(place, mode){
  const o = {};
  const when = departAt(place);
  if(mode === "TRANSIT") o.transitOptions = {departureTime: when};
  if(mode === "DRIVING") o.drivingOptions = {departureTime: when, trafficModel: "bestguess"};
  return o;
}

const pinSvg = (fill, ring) => ({
  path: "M 0,0 C -2,-20 -10,-22 -10,-30 A 10,10 0 1,1 10,-30 C 10,-22 2,-20 0,0 z",
  fillColor: fill, fillOpacity: 1, strokeColor: ring || "#fff", strokeWeight: 2.5,
  scale: 1, labelOrigin: new google.maps.Point(0, -30)
});

async function initMap(){
  const host = $("#mapBox");
  const key = getKey();
  if(!key){
    host.innerHTML = `<div class="empty">Add a Google Maps key via the
      <b>Keys</b> button to see the map.</div>`;
    renderLegend(); return;
  }
  const gate = mapsGateReason();
  if(gate){
    MAP.ready = false;
    host.innerHTML = `<div class="empty" style="line-height:1.7">${esc(gate)}</div>`;
    renderLegend(); return;
  }
  try{
    await loadMaps(key);
    const {Map} = await google.maps.importLibrary("maps");
    MAP.map = new Map(host, {
      center:{lat:50.062, lng:19.938}, zoom:12,
      mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
      clickableIcons:false, styles: MAP_STYLE
    });
    MAP.ready = true;
    await syncPins();
    const c = S.candidates.find(x=>x.id===selId);
    if(c) focusCandidate(c, false);
  }catch(e){
    if(!mapsAuthFailed) host.innerHTML = `<div class="empty">Map failed: ${esc(e.message)}</div>`;
  }
  renderLegend();
}

/* Pins for every geocoded candidate plus your places. Cheap — no routing. */
async function syncPins(){
  if(!MAP.ready) return;
  Object.values(MAP.pins).forEach(m=>m.setMap(null)); MAP.pins = {};
  MAP.placePins.forEach(m=>m.setMap(null)); MAP.placePins = [];
  const bounds = new google.maps.LatLngBounds();
  let any = false;

  for(const p of livePlaces()){
    if(!p.lat || !p.lon) continue;
    any = true;
    const pos = {lat:p.lat, lng:p.lon};
    MAP.placePins.push(new google.maps.Marker({
      map:MAP.map, position:pos, title:p.name, zIndex:50,
      icon: pinSvg("#25406e"),
      label:{text:(p.name[0]||"?").toUpperCase(), color:"#fff", fontWeight:"700", fontSize:"12px"}
    }));
    bounds.extend(pos);
  }
  for(const c of S.candidates){
    if(!c.lat || !c.lon) continue;
    any = true;
    const pos = {lat:c.lat, lng:c.lon};
    const m = score(c).match;
    const mk = new google.maps.Marker({
      map:MAP.map, position:pos, title:(c.address||"Flat"), zIndex:100,
      icon: pinSvg(scoreColor(m), c.id===selId ? "#141b25" : "#fff"),
      label:{text: m===null ? "–" : Math.round(m*100)+"", color:"#fff",
             fontWeight:"700", fontSize:"11px"}
    });
    mk.addListener("click", () => {
      selId = c.id; render();
      const card = document.querySelector(`.cand[data-id="${c.id}"]`);
      if(card) card.scrollIntoView({behavior:"smooth", block:"nearest"});
    });
    MAP.pins[c.id] = mk;
    bounds.extend(pos);
  }
  if(any && !MAP.fitted){ MAP.map.fitBounds(bounds, 60); MAP.fitted = true; }
}

function clearRoutes(){
  MAP.renderers.forEach(r=>r.setMap(null)); MAP.renderers = [];
  MAP.labels.forEach(l=>l.setMap(null)); MAP.labels = [];
}

/* Smoothly move to the selected flat and draw its routes. */
async function focusCandidate(c, animate = true){
  if(!MAP.ready || !c) return;
  await syncPins();                                   // restyle the selected pin
  if(!c.lat || !c.lon){ clearRoutes(); renderLegend(); return; }
  const here = {lat:c.lat, lng:c.lon};
  const mk = MAP.pins[c.id];
  if(mk && animate){
    mk.setAnimation(google.maps.Animation.BOUNCE);
    setTimeout(()=>mk.setAnimation(null), 700);
  }
  if(animate) MAP.map.panTo(here);

  // geoSig keys the cache (what a route *is*); sig also covers the display
  // filter, so toggling Bike/Transit redraws from cache without re-billing.
  const geoSig = [c.id, c.lat, c.lon, P().departHour,
    livePlaces().map(p=>[p.key,p.lat,p.lon,p.departHour,(p.modes||[]).map(m=>m.mode).join("/")].join(","))
      .join(";")].join("|");
  const sig = geoSig + "||" + shownModes().join("+");
  if(sig === MAP.routeSig) return;                    // already on screen
  MAP.routeSig = sig;
  clearRoutes();

  try{
    const {DirectionsService, DirectionsRenderer} = await google.maps.importLibrary("routes");
    const svc = new DirectionsService();
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(here);
    for(const p of livePlaces()){
      if(!p.lat || !p.lon) continue;
      bounds.extend({lat:p.lat, lng:p.lon});
      for(const m of (p.modes||[])){
        if(!modeShown(m.mode)) continue;      // display filter — scoring is unaffected
        try{
          // Every route is a billed request, and flipping between two flats used
          // to re-buy both. Cache on the same signature the redraw is keyed to.
          const ck = geoSig + "|" + p.id + "|" + m.mode;
          let res = MAP.cache.get(ck);
          if(!res){
            res = await svc.route(Object.assign({
              origin:here, destination:{lat:p.lat, lng:p.lon}, travelMode:m.mode
            }, routeOpts(p, m.mode)));
            MAP.cache.set(ck, res);
            if(MAP.cache.size > 300) MAP.cache.delete(MAP.cache.keys().next().value);
          }
          if(selId !== c.id) return;                  // user moved on mid-flight
          MAP.renderers.push(new DirectionsRenderer({
            map:MAP.map, directions:res, suppressMarkers:true, preserveViewport:true,
            polylineOptions:{strokeColor:ROUTE_COLOR[m.mode]||"#666", strokeWeight:5,
              strokeOpacity: m.mode==="TRANSIT" ? 0.75 : 0.95, zIndex: 10}
          }));
          const leg = res.routes?.[0]?.legs?.[0];
          if(leg?.duration?.value){
            const mins = Math.round(leg.duration.value/60);
            c.travel = c.travel||{}; c.travel[p.id] = c.travel[p.id]||{};
            if(c.travel[p.key][m.mode] !== mins){ c.travel[p.key][m.mode] = mins; touch(c); }
            const path = res.routes[0].overview_path || [];
            const mid = path[Math.floor(path.length/2)];
            if(mid) MAP.labels.push(new google.maps.Marker({
              map:MAP.map, position:mid, zIndex:200,
              icon:{path:google.maps.SymbolPath.CIRCLE, scale:0, fillOpacity:0, strokeOpacity:0},
              label:{text:`${mins} min`, color:ROUTE_COLOR[m.mode]||"#444",
                     fontWeight:"800", fontSize:"12px",
                     className:"routelabel"}
            }));
          }
        }catch(e){ console.warn("no route", p.name, m.mode, e?.code || e); }
      }
    }
    // Drawing routes is derived work. Persist it, but only schedule a push if a
    // value really changed — otherwise merely opening the page on a second
    // device would look like an edit and could win a merge it should lose.
    if(c.updatedAt && Date.now() - c.updatedAt < 5000) save(c); else saveLocal();
    document.querySelectorAll("input[data-pl]").forEach(el=>{
      const v = c.travel?.[el.dataset.pl]?.[el.dataset.mo];
      if(v!=null) el.value = v;
    });
    renderList(); refreshBox(); renderLegend();
    if(animate) MAP.map.fitBounds(bounds, 70);
  }catch(e){
    MAP.routeSig = null;
    console.warn("route drawing failed", e);
  }
}

/* Which modes get drawn. Purely a display filter — hiding transit does not
   change any score, the stored minutes are still counted. */
function availableModes(){ return [...new Set(livePlaces().flatMap(p=>(p.modes||[]).map(m=>m.mode)))]; }
function shownModes(){
  const avail = availableModes();
  const hidden = UI.hiddenModes || [];
  const on = avail.filter(m=>!hidden.includes(m));
  return on.length ? on : avail;      // never hide everything
}
const modeShown = m => shownModes().includes(m);
function toggleMode(m){
  const hidden = new Set(UI.hiddenModes || []);
  hidden.has(m) ? hidden.delete(m) : hidden.add(m);
  if(hidden.size >= availableModes().length) hidden.delete(m);   // keep one on
  UI.hiddenModes = [...hidden]; uiWrite();
  MAP.routeSig = null;
  const c = S.candidates.find(x=>x.id===selId);
  if(c && MAP.ready) focusCandidate(c, false);
  renderLegend();
}

function renderLegend(){
  const el = $("#mapLegend"); if(!el) return;
  const c = S.candidates.find(x=>x.id===selId);
  const hours = [6,7,8,8.5,9,9.5,10,11,12,14,17,18];
  el.innerHTML =
    availableModes().map(m=>{
      const on = modeShown(m);
      return `<label class="modechk ${on?"on":""}" data-mode="${m}">
        <input type="checkbox" ${on?"checked":""}>
        <i style="background:${ROUTE_COLOR[m]||"#666"};opacity:${on?1:.3}"></i>${MODES[m]}</label>`;
    }).join("") +
    `<span><span class="dot" style="background:#25406e"></span>places</span>` +
    `<span><span class="dot" style="background:#63be7b"></span>candidates by match</span>` +
    `<span>leaving at <select id="departSel">${hours.map(h=>
      `<option value="${h}" ${Number(P().departHour)===h?"selected":""}>${
        String(Math.floor(h)).padStart(2,"0")}:${h%1?"30":"00"}</option>`).join("")}</select></span>` +
    (c ? `<span class="sel">${esc(c.address||"—")}</span>` : "");
  el.querySelectorAll(".modechk").forEach(lb=>{
    lb.onclick = e => { e.preventDefault(); toggleMode(lb.dataset.mode); };
  });
  const sel = $("#departSel");
  if(sel) sel.onchange = () => {
    P().departHour = Number(sel.value); putSettings({departHour:P().departHour});
    MAP.routeSig = null;
    const cur = S.candidates.find(x=>x.id===selId);
    if(cur) focusCandidate(cur);
  };
}

/* ================================================== scraping
   The API holds the ScrapingBee and Anthropic keys; this page never sees them.
   Jobs run server-side and are polled, so you can keep browsing and editing
   other candidates while one is in flight.                                  */
const SB = {jobs:new Map(), timer:null};   // api() and idToken() live in the sync layer

$("#bScrape").onclick = async () => {
  const url = $("#sbUrl").value.trim();
  if(!url) return;
  if(!API){ alert("No scraper API configured. Set apiBase in config.js."); return; }
  const btn = $("#bScrape"); btn.disabled = true; btn.textContent = "Starting…";
  try{
    // Create the candidate up front so the row exists while the job runs.
    const c = {id:uid(), added:Date.now(), photos:[], travel:{}, link:url,
               address:"", notes:"Scraping…"};
    touch(c); S.candidates.unshift(c); selId = c.id; save(c); render();

    const res = await api("/api/scrape", {method:"POST",
      body: JSON.stringify({url, candidate_id: c.id})});
    SB.jobs.set(res.job_id, {id:res.job_id, url, cand:c.id, stages:res.stages,
                             stage:"queued", stage_label:"Queued", progress:0});
    $("#sbUrl").value = "";
    renderJobs(); startPolling();
  }catch(e){
    alert("Could not start: " + e.message);
  }finally{ btn.disabled = false; btn.textContent = "Scrape"; }
};

function startPolling(){
  if(SB.timer) return;
  SB.timer = setInterval(pollJobs, 1500);
}
async function pollJobs(){
  const live = [...SB.jobs.values()].filter(j=>j.stage!=="done" && j.stage!=="error");
  if(!live.length){ clearInterval(SB.timer); SB.timer = null; return; }
  for(const j of live){
    try{
      const s = await api("/api/scrape/" + j.id);
      Object.assign(j, s);
      if(s.stage === "done") applyScrape(j, s);
      if(s.stage === "error") j.errorShown = true;
    }catch(e){
      j.stage = "error"; j.error = e.message;
    }
  }
  renderJobs();
}

function renderJobs(){
  const host = $("#sbJobs"), panel = $("#sbPanel");
  if(!host || !panel) return;
  const list = [...SB.jobs.values()].reverse();
  panel.style.display = list.length ? "" : "none";
  document.body.classList.toggle("has-scrapes", list.length > 0);
  const live = list.filter(j=>j.stage!=="done" && j.stage!=="error").length;
  $("#sbCount").textContent = live ? `${live} running` : `${list.length} done`;

  host.innerHTML = list.map(j=>{
    const err = j.stage === "error", ok = j.stage === "done";
    const cand = S.candidates.find(c=>c.id===j.cand);
    const name = cand?.address || j.url;
    const steps = ok || err ? "" : (j.stages||[]).filter(s=>s.key!=="queued").map(s=>{
      const cur = s.key === j.stage, did = (j.progress||0) > s.at;
      return `<span class="${cur?"on":did?"did":""}">${esc(s.label)}</span>`;
    }).join("");
    return `<div class="sbjob ${ok?"ok":err?"bad":""}" data-cand="${esc(j.cand||"")}">
      <div class="top">
        <span class="dotstate ${ok?"ok":err?"bad":"run"}"></span>
        <span class="u" title="${esc(j.url)}">${esc(name)}</span>
        <span class="pct">${err ? "failed" : ok ? "✓" : (j.progress||0)+"%"}</span>
      </div>
      ${ok ? `<div class="tiny" style="margin-top:4px">${
                (j.result ? Object.values(j.result).filter(v=>v.value!=null).length : 0)
              } fields · ${(j.missing||[]).length} blank</div>`
           : err ? `<div class="tiny" style="margin-top:4px;color:var(--bad)">${esc(j.error||"")}</div>`
           : `<div class="sbbar"><i style="width:${j.progress||0}%"></i></div>
              <div class="st">${esc(j.stage_label||"…")}</div>
              <div class="sbsteps">${steps}</div>`}
    </div>`;
  }).join("");

  host.querySelectorAll(".sbjob[data-cand]").forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.cand;
      if(id && S.candidates.find(c=>c.id===id)){ selId = id; render(); }
    };
  });
}
$("#sbClear").onclick = () => {
  for(const [k,j] of [...SB.jobs]) if(j.stage==="done"||j.stage==="error") SB.jobs.delete(k);
  renderJobs();
};

/* Write the reconciled answer onto the candidate, then say what is missing. */
function applyScrape(job, s){
  const c = S.candidates.find(x=>x.id===job.cand);
  if(!c){ return; }
  const res = s.result || {};
  const filled = [], skipped = [];
  for(const [k, v] of Object.entries(res)){
    if(v.value === null || v.value === undefined){ skipped.push(k); continue; }
    const val = typeof v.value === "number" ? String(v.value) : v.value;
    // Answers live in c.answers and are read through ans(); writing c[k]
    // directly puts them somewhere the form never looks.
    setAns(c, k, val);
    if(["address","link","notes"].includes(k)) c[k] = val;   // real columns too
    filled.push(k);
  }
  c.scrape = {at: Date.now(), result: res,
              text_result: s.text_result || null, photo_result: s.photo_result || null,
              usage: s.usage || null};
  const L = s.listing || {};
  if(L.images?.length) c.photos = L.images;
  if(L.lat && !c.lat){ c.lat = L.lat; c.lon = L.lon; }
  if(!c.address && L.title){ c.address = L.title; setAns(c, "address", L.title); }
  const bits = [`Scraped ${new Date().toLocaleString()} — ${filled.length} fields filled, `
                + `${skipped.length} left blank.`];
  if(s.usage) bits.push(`Model tokens: ${s.usage.input_tokens} in / ${s.usage.output_tokens} out.`);
  c.notes = (c.notes === "Scraping…" ? "" : (c.notes ? c.notes + "\n\n" : "")) + bits.join(" ");
  setAns(c, "notes", c.notes);
  touch(c); save(c);
  MAP.routeSig = null; MAP.fitted = false;
  if(MAP.ready) syncPins();
  render();
  showScrapeReport(c, s, filled, skipped);
  // Press Calculate for you: geocodes the address if the listing gave no
  // coordinates, then measures every place and mode. Fire and forget — it
  // reports its own failures and must not block the report dialog.
  if(mapsAllowed()) calcTravel(c).catch(e=>console.warn("auto-calculate failed", e));
}

function showScrapeReport(c, s, filled, skipped){
  const label = labelOf;
  const res = s.result || {};
  const confChip = v => {
    const n = v.confidence;
    if(n === null || n === undefined) return "";
    const cls = n >= 0.7 ? "hi" : n >= 0.45 ? "mid" : "lo";
    return `<span class="conf ${cls}">${Math.round(n*100)}%</span>`;
  };
  const conflicts = [];
  for(const k of Object.keys(res)){
    const t = s.text_result?.[k]?.value, p = s.photo_result?.[k]?.value;
    if(t != null && p != null && String(t) !== String(p))
      conflicts.push(`${label(k)}: text said <b>${esc(String(t))}</b>, photos said
        <b>${esc(String(p))}</b> → kept <b>${esc(String(res[k].value))}</b>`);
  }
  const low = (s.low_confidence||[]).filter(k=>res[k]?.value != null);

  let html = `<div class="note">Filled <b>${filled.length}</b> of
    ${filled.length + skipped.length} fields for <b>${esc(c.address||"this listing")}</b>.
    Everything below is the model's reading of the advert, not fact — the blanks are
    deliberate, it was told to leave a field empty rather than guess.</div>`;

  if(skipped.length) html += `<h4 style="margin:12px 0 5px;font-size:12.5px">
      Could not be determined (${skipped.length}) — check these at the viewing</h4>
    <div class="tiny" style="line-height:1.9">${skipped.map(k=>
      `<span style="background:#f1f4f7;border-radius:6px;padding:2px 8px;margin-right:5px;
        display:inline-block">${esc(label(k))}</span>`).join("")}</div>`;

  if(low.length) html += `<h4 style="margin:14px 0 5px;font-size:12.5px">
      Filled but uncertain (${low.length}) — worth verifying</h4>
    <table class="fieldtable">${low.map(k=>`<tr><td class="k">${esc(label(k))}</td>
      <td class="v">${esc(String(res[k].value))}${confChip(res[k])}
      ${res[k].evidence?`<div class="tiny" style="font-weight:400;margin-top:2px">
        ${esc(res[k].evidence)}</div>`:""}</td></tr>`).join("")}</table>`;

  if(conflicts.length) html += `<h4 style="margin:14px 0 5px;font-size:12.5px">
      Text disagreed with the photographs (${conflicts.length})</h4>
    <div class="tiny" style="line-height:1.8">${conflicts.map(x=>"· "+x).join("<br>")}</div>`;

  html += `<h4 style="margin:14px 0 5px;font-size:12.5px">Filled (${filled.length})</h4>
    <table class="fieldtable">${filled.map(k=>`<tr><td class="k">${esc(label(k))}</td>
      <td class="v">${esc(String(res[k].value))}${confChip(res[k])}</td></tr>`).join("")}</table>`;

  dialog("Scrape finished", html, [{label:"Close", primary:true}]);
}

/* ================================================================ boot */
$("#lb").onclick = () => { $("#lb").style.display = "none"; };
$("#sortBy").onchange = renderList;
$("#bAdmin").onclick = () => openAdmin();
$("#syncPill").onclick = () => { if(LAST_ERROR) showSyncProblem(); };
$("#bKeys").onclick = setupDialog;
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#lb").style.display="none"; });

uiRead();
cacheRead();                 // show something instantly, before the network settles
$("#tagline").textContent = API
  ? "Criteria and candidates live on your server."
  : "No server configured — set apiBase in config.js.";
render();
initFirebase();
</script>
