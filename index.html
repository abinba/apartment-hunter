<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="robots" content="noindex, nofollow">
<title>Apartment Hunter</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f6f9; --panel:#fff; --ink:#141b25; --muted:#69737f; --line:#e6eaef;
  --navy:#25406e; --green:#3d6b3a; --gold:#8a6d13; --orange:#96521f; --purple:#4a3f78;
  --teal:#1c6b7a; --yellow:#fffcf0; --accent:#3272c4; --bad:#c53030; --good:#2f855a;
  --r:14px; --sh:0 1px 2px rgba(20,27,37,.05), 0 4px 14px rgba(20,27,37,.05);
  --shx:0 2px 6px rgba(20,27,37,.07), 0 12px 32px rgba(20,27,37,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:
   radial-gradient(1100px 480px at 12% -8%, #eaf1fa 0%, transparent 62%),
   radial-gradient(900px 420px at 96% 0%, #f2eefb 0%, transparent 58%), var(--bg);
  background-attachment:fixed;color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;max-width:1560px;margin:0 auto}
.col-list{flex:0 0 340px;position:sticky;top:16px}
.col-form{flex:1;min-width:0}
.col-scrapes{flex:0 0 270px;position:sticky;top:16px}
.col-scrapes #sbJobs{max-height:calc(100vh - 150px);overflow:auto;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
h1{font-size:16px;margin:0;letter-spacing:-.2px;font-weight:750}
.sub{color:var(--muted);font-size:11.5px;margin-top:1px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;
  padding-left:max(18px,env(safe-area-inset-left));
  padding-right:max(18px,env(safe-area-inset-right));
  background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
header.top .spacer{flex:1}
.brandrow{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.titles{min-width:0}
.actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand{width:30px;height:28px;border-radius:9px;flex:0 0 auto;letter-spacing:-.5px;
  background:linear-gradient(140deg,#3272c4,#25406e);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(37,64,110,.28)}
.btn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  color:#39434f;font-weight:550;transition:.14s ease;box-shadow:0 1px 1px rgba(20,27,37,.03)}
.btn:hover{border-color:#c9d3de;color:var(--ink);transform:translateY(-1px);
  box-shadow:0 3px 9px rgba(20,27,37,.08)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(140deg,#3272c4,#25406e);border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(37,64,110,.3)}
.btn.danger{color:var(--bad);border-color:#f3d3d3}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.listhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.listhead select{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff}
.cands{max-height:calc(100vh - 200px);overflow:auto;padding:9px;scrollbar-width:thin}
.cand{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;
  background:#fff;transition:.15s ease;cursor:pointer;position:relative;overflow:hidden}
.cand::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;
  transition:.15s ease}
.cand:hover{border-color:#cfdae7;transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,27,37,.07)}
.cand.sel{border-color:#a8c6ea;background:#fcfdff;box-shadow:0 3px 14px rgba(50,114,196,.13)}
.cand.sel::before{background:linear-gradient(180deg,#3272c4,#25406e)}
.cand .nm{font-weight:640;font-size:13px;margin-bottom:7px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cand .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score{font-weight:780;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.bar{height:5px;border-radius:4px;background:#eef1f5;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s ease}
.chip{display:inline-block;padding:2.5px 9px;border-radius:999px;font-size:10.5px;font-weight:700;
  white-space:nowrap;line-height:1.5;letter-spacing:.1px}
.tiny{font-size:11px;color:var(--muted)}
.permo{font-size:11.5px;font-weight:650;color:#41525f;background:#eef2f6;border-radius:999px;
  padding:2px 9px;white-space:nowrap}
.permo.over{background:#fdeae3;color:#a33000}
.psqm{font-size:11px;color:#5d6976;background:#f3f5f8;border-radius:999px;padding:2px 8px}
.overtxt{color:var(--bad);font-weight:650}
.routelabel{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff;
  paint-order:stroke fill}
.sect{margin-bottom:14px;overflow:hidden}
.sect > h3{margin:0;padding:11px 15px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:750;color:#3c4653;background:linear-gradient(180deg,#fbfcfe,#f5f7fa);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sect > h3::before{content:"";width:9px;height:9px;border-radius:3px;flex:0 0 auto;
  background:var(--acc,#8792a2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc,#8792a2) 16%,transparent)}
.sect .body{padding:14px 15px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:550}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid #e2e7ee;
  border-radius:9px;background:var(--yellow);transition:.14s ease}
.f input:hover,.f select:hover,.f textarea:hover{border-color:#cfd8e3}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:#8fb4e2;
  background:#fff;box-shadow:0 0 0 3px rgba(50,114,196,.13)}
.f.wide{grid-column:1/-1}
.f .hint{font-size:10.5px;color:#9aa5b1;margin-top:3px;line-height:1.35}
.f.calc input{background:#f2f4f7;color:#46525f;font-weight:700;border-style:dashed}
.seg,.rate{display:flex;gap:4px}
.seg button,.rate button{flex:1;border:1px solid #e2e7ee;background:#fff;padding:8px 0;
  font-size:12.5px;border-radius:8px;color:#5c6774;font-weight:550;transition:.13s ease}
.seg button:hover,.rate button:hover{border-color:#c6d1de;background:#fafbfd}
.seg button.on[data-v="Yes"]{background:#e7f4e4;border-color:#8fc389;color:#245b1f;font-weight:730}
.seg button.on[data-v="No"]{background:#fdeae3;border-color:#e5a98f;color:#8a2b00;font-weight:730}
.seg button.on[data-v=""]{background:#eef1f5;border-color:#d5dce4;color:#525d6a;font-weight:730}
.rate button.on{background:linear-gradient(140deg,#3272c4,#25406e);border-color:transparent;
  color:#fff;font-weight:730;box-shadow:0 2px 7px rgba(37,64,110,.26)}
.scorebox{display:flex;align-items:center;gap:20px;padding:16px 18px;flex-wrap:wrap}
.ring{position:relative;width:74px;height:74px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;
  font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kv{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kv b{display:block;font-size:15px;color:var(--ink);font-weight:730;letter-spacing:-.2px;
  text-transform:none;margin-top:2px}
.why{padding:0 16px 13px;font-size:12px;color:var(--muted);line-height:1.7}
.why span{display:inline-block;margin:2px 5px 2px 0;padding:3px 9px;border-radius:7px;
  background:#f2f5f8;border:1px solid #e8edf3}
.why span.lost{background:#fdeee9;border-color:#f6d8cd;color:#8a2b00;font-weight:600}
.gal{display:flex;gap:8px;overflow-x:auto;padding:13px 15px;scrollbar-width:thin}
.gal img{height:104px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;flex:0 0 auto;
  transition:.16s ease}
.gal img:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 18px rgba(20,27,37,.16)}
.gal .ph{height:96px;min-width:150px;border:1px dashed var(--line);border-radius:6px;display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:11.5px;text-align:center;padding:8px}
#lb{position:fixed;inset:0;background:rgba(15,20,28,.88);display:none;align-items:center;
  justify-content:center;z-index:99;padding:24px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
dialog{border:1px solid var(--line);border-radius:11px;padding:0;max-width:660px;width:94%}
dialog::backdrop{background:rgba(15,20,28,.45)}
.dlg-h{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700}
.dlg-b{padding:14px 15px;max-height:70vh;overflow:auto}
.dlg-f{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
textarea.mono{width:100%;height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fbfcfd}
.note{background:#fff8e6;border:1px solid #f0dfae;border-radius:7px;padding:9px 11px;
  font-size:12.5px;margin-bottom:11px}
.note.warn{background:#fdeceb;border-color:#f2c4bd}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
table.wt{width:100%;border-collapse:collapse;font-size:12.5px}
table.wt td{padding:3px 5px;border-bottom:1px solid #f0f2f5}
table.wt input{width:64px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;
  background:var(--yellow);text-align:center}
/* travel */
.trav{padding:11px 13px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pl{border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.pl .pn{font-weight:700;font-size:12.5px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.pl .pn small{font-weight:400;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:7px;margin-top:4px}
.mrow .ml{flex:0 0 62px;font-size:11.5px;color:var(--muted)}
.mrow input{width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;
  background:var(--yellow);text-align:center}
.mrow .mb{height:5px;flex:1;border-radius:3px;background:#eceff3;overflow:hidden}
.mrow .mb i{display:block;height:100%}
.pe{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:9px}
.pe .r{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pe input[type=text]{flex:1;min-width:130px;padding:5px 7px;border:1px solid var(--line);
  border-radius:5px;background:var(--yellow)}
.pe input[type=number]{width:62px;padding:5px 7px;border:1px solid var(--line);
  border-radius:5px;background:var(--yellow);text-align:center}
#printSheet{display:none}
.sync{font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:999px;white-space:nowrap;
  background:#eef1f5;color:#5b6672;border:1px solid #e2e7ee}
.sync.ok{background:#e7f4e4;color:#245b1f;border-color:#c3e2bc}
.sync.busy{background:#fff4d9;color:#7a5a00;border-color:#f0dfae}
.sync.err{background:#fdeae3;color:#8a2b00;border-color:#f3cdbe}
#mapPanel{max-width:1560px;margin:16px auto 0;padding:0 16px}
.mapcard{overflow:hidden}
#mapBox{height:400px;width:100%;background:#eef1f5}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 15px;
  font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:#fbfcfd}
.maplegend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;
  margin-right:6px}
.maplegend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;
  margin-right:5px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.maplegend b{color:var(--ink);font-weight:650}
.maplegend .sel{margin-left:auto;font-weight:650;color:var(--ink)}
.modechk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;
  transition:.13s ease;color:var(--muted)}
.modechk:hover{border-color:#c6d1de}
.modechk.on{background:#eef4fb;border-color:#bcd3ee;color:var(--ink);font-weight:650}
.modechk input{margin:0;width:13px;height:13px;accent-color:var(--accent)}
.maplegend select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fff;
  font-size:11.5px}
.cand{scroll-margin-top:80px}


.scrapebar{margin-top:12px;padding:12px 15px}
.sb-row{display:flex;gap:9px;align-items:center}
.sb-row input{flex:1;min-width:0;padding:9px 12px;border:1px solid #e2e7ee;border-radius:10px;
  background:var(--yellow);transition:.14s ease}
.sb-row input:focus{outline:none;border-color:#8fb4e2;background:#fff;
  box-shadow:0 0 0 3px rgba(50,114,196,.13)}
.sbjob{margin:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;transition:.14s ease}
.sbjob:hover{border-color:#c9d3de;box-shadow:0 3px 10px rgba(20,27,37,.06)}
.sbjob.ok{background:#f7fcf6;border-color:#cfe6c9}
.sbjob.bad{background:#fdf6f4;border-color:#f0cfc4}
.dotstate{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dotstate.run{background:#3272c4;animation:pulse 1.2s ease-in-out infinite}
.dotstate.ok{background:#2f855a}
.dotstate.bad{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sbjob .st{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.sbjob .top{display:flex;align-items:center;gap:9px;font-size:12px}
.sbjob .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted)}
.sbjob .st{font-weight:650;color:var(--ink);white-space:nowrap}
.sbjob .pct{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.sbbar{height:6px;border-radius:4px;background:#eaeef3;margin-top:8px;overflow:hidden}
.sbbar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#3272c4,#1f9254);transition:width .5s ease}
.sbbar.err i{background:var(--bad)}
.sbsteps{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;font-size:10.5px;color:#9aa5b1}
.sbsteps span{padding:1px 7px;border-radius:999px;background:#f1f4f7}
.sbsteps span.on{background:#e3edf9;color:#1f4e79;font-weight:650}
.sbsteps span.did{background:#e7f4e4;color:#2f6b2a}
.fieldtable{width:100%;border-collapse:collapse;font-size:12.5px}
.fieldtable td{padding:4px 6px;border-bottom:1px solid #f0f2f5;vertical-align:top}
.fieldtable td.k{color:var(--muted);width:42%}
.fieldtable td.v{font-weight:650}
.conf{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:6px;
  font-weight:700}
.conf.hi{background:#e7f4e4;color:#245b1f}
.conf.mid{background:#fff4d9;color:#7a5a00}
.conf.lo{background:#fdeae3;color:#8a2b00}


/* admin panel */
.tabs{display:flex;gap:4px;padding:3px;background:#f1f4f7;border-radius:10px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:12.5px;
  font-weight:600;color:var(--muted);transition:.14s ease}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,27,37,.1)}
.adcat{border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;
  background:#fff}
.adcat-h{display:flex;align-items:center;gap:9px;padding:10px 13px;
  background:linear-gradient(180deg,#fbfcfe,#f5f7fa);border-bottom:1px solid var(--line)}
.adcat-h b{font-size:13px;font-weight:650}
.swatch{width:11px;height:11px;border-radius:4px;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.adcat-b{padding:2px 0}
.adrow{display:flex;align-items:center;gap:9px;padding:7px 13px;font-size:12.5px;
  border-bottom:1px solid #f4f6f9;transition:.12s ease}
.adrow:last-of-type{border-bottom:0}
.adrow:hover{background:#fafbfd}
.adlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:550;display:flex;gap:6px;align-items:baseline}
.mono{font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:10.5px;
  background:#f1f4f7;border-radius:5px;padding:1px 6px;color:#5d6976}
.wcell{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;
  color:var(--ink)}
.f label input[type=checkbox]{vertical-align:-1px}
dialog .f code{background:#f1f4f7;border-radius:4px;padding:0 4px;font-size:11.5px}

@media (max-width:1240px) {
.col-scrapes{flex:1 1 100%;position:static;order:3;min-width:0;max-width:100%}
  .col-scrapes #sbJobs{max-height:none;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}

@media (max-width:900px) {
#mapPanel{padding:0 9px;margin-top:9px}
  #mapBox{height:280px}
  .maplegend{font-size:11px;gap:9px}

.sb-row{flex-wrap:wrap}.sb-row input{width:100%}

/* ---- layout ---------------------------------------------------------- */
  /* align-items:flex-start on .wrap means children size to their content on
     the cross axis. Once the container is a column, that cross axis is the
     width — so a column without an explicit width grows to its widest row and
     spills past the others. Stretch instead, and pin all three to 100%. */
  .wrap{flex-direction:column;padding:10px;gap:10px;align-items:stretch;
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right))}
  .col-list,.col-scrapes,.col-form{position:static;flex:0 0 auto;
    width:100%;max-width:100%;min-width:0}
  .card,.sect{max-width:100%}
  .cands{max-height:none}
  .sect .body{grid-template-columns:1fr;padding:12px}
  .card{border-radius:12px}

  /* ---- header: title row, then a scrollable action bar ------------------ */
  header.top{padding:9px 10px;gap:8px;
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right))}
  header.top h1{font-size:15px}
  header.top .sub{display:none}
  .brandrow{flex:1 1 100%}
  .actions{flex:1 1 100%;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px}
  .actions::-webkit-scrollbar{display:none}
  .actions .btn{flex:0 0 auto;white-space:nowrap}
  .btn{padding:8px 12px}
  #syncPill{max-width:44vw;overflow:hidden;text-overflow:ellipsis}

  /* ---- 16px inputs, otherwise iOS zooms the whole page on focus --------- */
  .f input,.f select,.f textarea,.sb-row input,
  .pe input,.mrow input,dialog input,dialog select,dialog textarea{font-size:16px}
  .seg button,.rate button{padding:10px 0;font-size:14px}

  /* ---- score header ---------------------------------------------------- */
  .scorebox{gap:12px;padding:12px;align-items:flex-start}
  .ring{width:60px;height:60px}
  .ring svg{width:60px;height:60px}
  .ring .rt{font-size:14px}
  .scorebox .kv{flex:1 1 calc(50% - 12px);min-width:0}
  .scorebox > div:nth-child(2){flex:1 1 100%;order:-1}
  .scorebox #bDel{margin-left:auto}

  /* ---- map ------------------------------------------------------------- */
  #mapPanel{padding:0 10px;margin-top:10px;
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right))}
  #mapBox{height:250px}
  .maplegend{gap:8px;padding:9px 11px;flex-wrap:nowrap;overflow-x:auto;

<script src="config.js"></script>
<script>
"use strict";
const CFG = window.APP_CONFIG || {};
/* ================================================================ config
   The schema — categories, criteria, weights, thresholds, places — lives in
   Postgres and arrives from GET /api/schema. Nothing below is a default in the
   old sense; it is only what the page falls back to when it has never
   successfully reached the server and has no cached copy.                   */

const MODES = {BICYCLING:"Bike", TRANSIT:"Transit", WALKING:"Walk", DRIVING:"Car"};

const FALLBACK_SETTINGS = {
  budgetYear:42500, overPct:0.05, highThr:0.75, midThr:0.60, minData:0.35,
  moveInBy:"2026-09-01", departHour:10, city:"Kraków", region:"pl"
};

/* Derived, non-editable rows shown inside a category. They are computed from
   other answers rather than typed, so they are not criteria in the database. */
const COMPUTED = {
  cost: [
    {k:"total",    l:"Total monthly zł"},
    {k:"persqm",   l:"zł per m² per month"},
    {k:"headroom", l:"Budget headroom zł"},
  ]
};

/* --- schema helpers ------------------------------------------------------ */
const SCHEMA = {categories:[], criteria:[], places:[], settings:{...FALLBACK_SETTINGS}};

const liveCriteria = () => SCHEMA.criteria.filter(c=>!c.archived);
const scoredCriteria = () => liveCriteria().filter(c=>c.scored && c.weight > 0);
const livePlaces = () => SCHEMA.places.filter(p=>!p.archived);
const critByKey = k => SCHEMA.criteria.find(c=>c.key===k);
const P = () => SCHEMA.settings;

/* Categories with their criteria attached, in sort order — what the form renders. */
function groups(){
  const out = [];
  for(const cat of SCHEMA.categories.filter(c=>!c.archived).sort((a,b)=>a.sort-b.sort)){
    const fields = liveCriteria()
      .filter(c=>c.category_key===cat.key && c.kind!=="budget")
      .sort((a,b)=>a.sort-b.sort)
      .map(c=>({k:c.key, l:c.label, hint:c.hint, type:inputType(c),
                opts:(c.options||[]).map(o=>o.value),
                wide:["text","textarea","url"].includes(inputType(c)) &&
                     ["address","link","notes"].includes(c.key)}));
    for(const extra of (COMPUTED[cat.key]||[])) fields.push({k:extra.k, l:extra.l, type:"calc"});
    if(fields.length) out.push({id:cat.key, title:cat.title, color:cat.color, fields});
  }
  return out;
}
function inputType(c){
  switch(c.kind){
    case "yesno": return "yesno";
    case "r3": return "r3";
    case "enum": return "select";
    case "num": case "distance": return "num";
    case "date": return "date";
    case "datetime": return "datetime-local";
    case "textarea": return "textarea";
    case "budget": case "calc": return "calc";
    default: return c.key === "link" ? "url" : "text";
  }
}
const labelOf = k => critByKey(k)?.label
  || (Object.values(COMPUTED).flat().find(x=>x.k===k)?.l) || k;

/* Hand-written viewing questions. Deliberately kept as prose rather than
   generated from criteria — "Czy okna wychodzą na wschód?" asks better than a
   field label does. Criteria you add yourself are appended to the sheet
   separately, so nothing you configure goes unasked.                        */
const OWNER_Q = [
  "Od kiedy mieszkanie jest dostępne? (nie później niż 1 września)",
  "Czy jest ogrzewanie miejskie? Jaki jest średni koszt zimą?",
  "Jaki jest średni miesięczny koszt prądu i gazu?",
  "Jaka jest wysokość czynszu administracyjnego i co obejmuje?",
  "Ile wynosi kaucja? Czy jest prowizja pośrednika?",
  "Kiedy budynek był budowany / mieszkanie remontowane?",
  "Czy lodówka, pralka i zmywarka działają poprawnie?",
  "Piekarnik i płyta — gaz czy prąd?",
  "Jacy dostawcy internetu są dostępni? (preferowany Play)",
  "Czy umowa będzie standardowa czy okazjonalna?",
  "Jakie zmiany w umeblowaniu można wprowadzać?",
  "Czy okna wychodzą na wschód / północ?",
  "Jakie są relacje z sąsiadami — czy są spokojni?",
  "Czy jest miejsce na rower (piwnica, rowerownia)?"
];
const SELF_Q = [
  "Czy zmieści się biurko 140×90 cm?",
  "Czy jest miejsce na pianino 120×50 cm?",
  "Czy jest oddzielna sypialnia?",
  "Czy jest dużo światła dziennego?",
  "Czy okna są nowe i dobrze izolują?",
  "Czy nie ma wilgoci ani pleśni (rogi, łazienka, za meblami)?",
  "Czy winda działa poprawnie?",
  "Czy kuchnia nie jest za mała?",
  "Czy okolica jest cicha?",
  "Wanna / szafa / balkon?"
];

const STATUS_STYLE = {
  "Pending presentation":  ["#ffe699","#7f6000"],
  "Check availability":    ["#ffd9b3","#974706"],
  "Presentation scheduled":["#bdd7ee","#1f4e79"],
  "Contact now":           ["#c6e0b4","#375623"],
  "Shortlist":             ["#e2efda","#375623"],
  "Low match":             ["#e7e6e6","#595959"],
  "Incomplete":            ["#f2f2f2","#8a8a8a"],
  "Rejected — too late":   ["#ff9999","#7b0000"],
  "Rejected":              ["#f8cbad","#c00000"],
  "On hold":               ["#d9d9d9","#3f3f3f"],
  "Applied":               ["#a9d08e","#1f3864"],
  "Signed":                ["#70ad47","#ffffff"]
};

/* ================================================================ state
   Candidates live in Postgres. Local storage is a read-only mirror: if the
   server is unreachable you can still open the app, look at everything and see
   scores, but edits are refused rather than queued. Queueing would let two
   devices drift apart and need reconciling, which is exactly the class of bug
   we just spent a session removing.                                        */
const KEY = "apartment-hunter-v2";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let S = {candidates: []};
let selId = null;
let ONLINE = false;          // schema + candidates loaded from the server
let READONLY = true;         // no writes accepted until we are online

function cacheWrite(){
  try{ localStorage.setItem(KEY, JSON.stringify(
    {schema:SCHEMA, candidates:S.candidates, at:Date.now()})); }catch(e){}
}
function cacheRead(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!d) return false;
    Object.assign(SCHEMA, d.schema || {});
    S.candidates = d.candidates || [];
    return true;
  }catch(e){ return false; }
}

/* Answers are stored under candidate.answers, but the form and the scoring
   read them by key. These two keep that indirection in one place. */
const ans = (c, k) => (c && c.answers) ? c.answers[k] : undefined;
function setAns(c, k, v){
  c.answers = c.answers || {};
  if(v === "" || v === null || v === undefined) delete c.answers[k];
  else c.answers[k] = v;
}

/* ================================================================ scoring
   One rule per criterion kind, all driven by the database row. The special
   cases the old build carried — grocery chains, window orientation, contract
   type — are now just enums whose options carry points, which reproduces the
   old numbers exactly without three bespoke branches.                       */
const clamp01 = x => Math.max(0, Math.min(1, x));
const numOrNull = v => (v===""||v===null||v===undefined||isNaN(Number(v))) ? null : Number(v);

function costs(c){
  const parts = ["rent","admin","util"].map(k=>numOrNull(ans(c,k))).filter(v=>v!==null);
  const total = parts.length ? parts.reduce((a,b)=>a+b,0) : null;
  const prov  = numOrNull(ans(c,"provision")) || 0;
  const yearly = total===null ? null : total*12 + prov;
  const area = numOrNull(ans(c,"area"));
  return {total, yearly,
          headroom: yearly===null ? null : P().budgetYear - yearly,
          persqm: (total===null || !area) ? null : total/area};
}

function frac(c, cr){
  const v = ans(c, cr.key);
  switch(cr.kind){
    case "budget": {
      const y = costs(c).yearly; if(y===null) return null;
      const B = P().budgetYear, o = P().overPct || 0.05;
      return clamp01((B*(1+o) - y) / (B*o));
    }
    case "distance": {
      const x = numOrNull(v); if(x===null) return null;
      const cfg = cr.config || {}; const f = Number(cfg.full), z = Number(cfg.zero);
      return (isNaN(f) || isNaN(z) || z===f) ? null : clamp01((z-x)/(z-f));
    }
    case "num": { const x = numOrNull(v); return x===null ? null : clamp01(x); }
    case "r3": { const x = numOrNull(v); return x===null ? null : clamp01(x/3); }
    case "yesno": return v==="Yes" ? 1 : (v==="No" ? 0 : null);
    case "enum": {
      if(!v) return null;
      const opts = cr.options || [];
      const hit = opts.find(o=>o.value===v);
      const max = Math.max(...opts.map(o=>Number(o.points)||0), 0);
      return hit ? (max > 0 ? (Number(hit.points)||0)/max : 0) : 0;
    }
  }
  return null;
}
const travelMins = (c,p,m) => numOrNull(c.travel?.[p.key]?.[m.mode]);
function modeWeight(p, m){
  const tot = (p.modes||[]).reduce((a,x)=>a+(Number(x.share)||0), 0) || 1;
  return (Number(p.weight)||0) * ((Number(m.share)||0)/tot);
}
function modeFrac(c, p, m){
  const t = travelMins(c,p,m);
  return t===null ? null : (m.zero===m.full ? null : clamp01((m.zero-t)/(m.zero-m.full)));
}

function score(c){
  let earned=0, avail=0, totalW=0; const lost=[];
  for(const cr of scoredCriteria()){
    const w = Number(cr.weight)||0; totalW += w;
    const f = frac(c, cr); if(f===null) continue;
    avail += w; earned += w*f;
    if(f < 0.5 && w >= 3) lost.push({n:cr.label, pts:+(w*(1-f)).toFixed(1)});
  }
  for(const p of livePlaces()) for(const m of (p.modes||[])){
    const w = modeWeight(p,m); totalW += w;
    const f = modeFrac(c,p,m); if(f===null) continue;
    avail += w; earned += w*f;
    if(f < 0.5 && w >= 2) lost.push({n:`${p.name} by ${MODES[m.mode].toLowerCase()}`,
                                     pts:+(w*(1-f)).toFixed(1)});
  }
  lost.sort((a,b)=>b.pts-a.pts);
  return {earned, avail, totalW, match: avail>0?earned/avail:null,
          filled: totalW>0?avail/totalW:0, lost:lost.slice(0,5)};
}

function statusOf(c){
  const sc = score(c), p = P();
  if(!c.link && !c.address) return "";
  if(c.status_override) return c.status_override;
  const availfrom = ans(c,"availfrom");
  if(availfrom && p.moveInBy && availfrom > p.moveInBy) return "Rejected — too late";
  if(ans(c,"presched") === "Yes") return "Presentation scheduled";
  if(sc.match===null || sc.filled < p.minData) return "Incomplete";
  if(sc.match >= p.highThr && ans(c,"messaged") === "Yes" && !availfrom) return "Check availability";
  if(sc.match >= p.highThr && ans(c,"messaged") === "Yes") return "Pending presentation";
  if(sc.match >= p.highThr) return "Contact now";
  if(sc.match >= p.midThr)  return "Shortlist";
  return "Low match";
}
const scoreColor = m => m===null ? "#c3ccd6"
  : m>=0.85 ? "#63be7b" : m>=0.7 ? "#a9cf7a" : m>=0.55 ? "#ffd666" : "#f0836b";
const money = v => (v===null||v===undefined||v==="") ? "—"
  : Math.round(v).toLocaleString("pl-PL")+" zł";

/* ================================================================ render */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function ring(m){
  const R = 31, C = 2*Math.PI*R, col = scoreColor(m), pct = m===null ? 0 : m;
  return `<div class="ring"><svg width="74" height="74" viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="${R}" fill="none" stroke="#edf0f4" stroke-width="7"/>
      <circle class="rp" cx="37" cy="37" r="${R}" fill="none" stroke="${col}" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${C}"
        stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .45s ease"/>
    </svg><div class="rt" style="color:${col}">${m===null?"—":Math.round(m*100)+"%"}</div></div>`;
}
function chip(st){ if(!st) return "";
  const [bg,fg] = STATUS_STYLE[st] || ["#eee","#333"];
  return `<span class="chip" style="background:${bg};color:${fg}">${esc(st)}</span>`; }

function renderList(){
  const sort = $("#sortBy").value, arr = S.candidates.slice();
  const sc = c => score(c).match ?? -1;
  if(sort==="score")  arr.sort((a,b)=>sc(b)-sc(a));
  if(sort==="yearly") arr.sort((a,b)=>(costs(a).yearly??9e9)-(costs(b).yearly??9e9));
  if(sort==="sqm")    arr.sort((a,b)=>(costs(a).persqm??9e9)-(costs(b).persqm??9e9));
  if(sort==="added")  arr.sort((a,b)=>(b.added||0)-(a.added||0));
  $("#cCount").textContent = S.candidates.length ? S.candidates.length+" saved" : "";
  if(!arr.length){ $("#list").innerHTML = `<div class="empty">Nothing yet — hit <b>+ New</b>.</div>`; return; }
  $("#list").innerHTML = arr.map(c=>{
    const s = score(c), st = statusOf(c), cc = costs(c);
    const pct = s.match===null ? "—" : Math.round(s.match*100)+"%";
    const over = cc.headroom!==null && cc.headroom < 0;
    const p0 = livePlaces()[0];
    const work = p0 && p0.modes?.[0] ? travelMins(c, p0, p0.modes[0]) : null;
    return `<div class="cand ${c.id===selId?"sel":""}" data-id="${c.id}">
      <div class="nm">${esc(c.address || "Untitled — add an address")}</div>
      <div class="row2">
        <span class="score" style="color:${scoreColor(s.match)}">${pct}</span>
        <span class="permo ${over?"over":""}">${cc.total===null?"—":money(cc.total)+"/mo"}</span>
        ${cc.persqm!==null?`<span class="psqm">${cc.persqm.toFixed(0)} zł/m²</span>`:""}
        ${chip(st)}
      </div>
      <div class="bar"><i style="width:${s.match===null?0:s.match*100}%;
        background:${scoreColor(s.match)}"></i></div>
      <div class="tiny" style="margin-top:5px">
        <span class="${over?"overtxt":""}">${money(cc.yearly)}/yr${
          over?" · "+money(Math.abs(cc.headroom))+" over":""}</span>
        · ${Math.round(s.filled*100)}% filled${work!==null?" · 🚲 "+work+" min":""}
      </div></div>`;
  }).join("");
  document.querySelectorAll(".cand").forEach(el=>{
    el.onclick = () => { selId = el.dataset.id; render();
      if(innerWidth<=900) $("#form").scrollIntoView({behavior:"smooth",block:"start"}); };
  });
}

function field(c, f){
  const v = f.type === "calc" ? ""
          : (["address","link","notes"].includes(f.k) ? (c[f.k] ?? ans(c,f.k) ?? "")
                                                      : (ans(c, f.k) ?? ""));
  const id = "f_"+f.k;
  let inner = "";
  if(f.type==="yesno"){
    inner = `<div class="seg" data-k="${f.k}">${["Yes","No",""].map(o=>
      `<button data-v="${o}" class="${v===o?"on":""}">${o||"?"}</button>`).join("")}</div>`;
  } else if(f.type==="r3"){
    inner = `<div class="rate" data-k="${f.k}">${["0","1","2","3",""].map(o=>
      `<button data-v="${o}" class="${String(v)===o?"on":""}">${o||"?"}</button>`).join("")}</div>`;
  } else if(f.type==="select"){
    inner = `<select id="${id}" data-k="${f.k}">${f.opts.map(o=>
      `<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o||"—")}</option>`).join("")}</select>`;
  } else if(f.type==="textarea"){
    inner = `<textarea id="${id}" data-k="${f.k}" rows="3">${esc(v)}</textarea>`;
  } else if(f.type==="calc"){
    const cc = costs(c);
    const val = {total:cc.total, yearly:cc.yearly, headroom:cc.headroom, persqm:cc.persqm}[f.k];
    const txt = (val===null||val===undefined) ? "—"
              : (f.k==="persqm" ? val.toFixed(1)+" zł/m²" : money(val));
    const col = (f.k==="headroom" && val!==null && val<0) ? "color:var(--bad)" : "";
    inner = `<input readonly value="${txt}" style="${col}">`;
  } else {
    inner = `<input id="${id}" data-k="${f.k}" type="${f.type==="num"?"number":f.type}"
      value="${esc(v)}" ${f.type==="num"?'step="any" min="0"':""}>`;
  }
  return `<div class="f ${f.wide?"wide":""} ${f.type==="calc"?"calc":""}">
    <label for="${id}">${esc(f.l)}</label>${inner}
    ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}

function travelPanel(c){
  let h = `<div class="card sect"><h3 style="--acc:var(--teal)">Travel times
    <span style="font-weight:400;text-transform:none;letter-spacing:0;opacity:.8">
      minutes — lower is better</span>
    <div style="flex:1"></div>
    <button class="btn sm" id="bCalc" style="color:#155e75">Calculate</button>
    </h3><div class="trav">`;
  for(const p of livePlaces()){
    h += `<div class="pl"><div class="pn">${esc(p.name)}
      <small>weight ${p.weight}</small></div>`;
    for(const m of (p.modes||[])){
      const t = travelMins(c,p,m), f = modeFrac(c,p,m);
      h += `<div class="mrow">
        <span class="ml">${MODES[m.mode]}</span>
        <input type="number" min="0" step="1" data-pl="${p.key}" data-mo="${m.mode}"
          value="${t===null?"":t}" placeholder="—">
        <span class="mb"><i style="width:${f===null?0:f*100}%;
          background:${scoreColor(f)}"></i></span>
      </div>`;
    }
    h += `</div>`;
  }
  if(!livePlaces().length) h += `<div class="tiny">No places yet — add some in the admin panel.</div>`;
  h += `</div><div class="why"><span>Weight is split across modes by the shares you set,
    so bike counts for more than transit. Blank means not measured, and it is left out of the
    score rather than counted as bad.</span></div></div>`;
  return h;
}

function renderForm(){
  const c = S.candidates.find(x=>x.id===selId);
  if(!c){ $("#form").innerHTML = `<div class="card"><div class="empty">
    Pick a candidate, or add a new one.</div></div>`; buildPrint(null); return; }
  const s = score(c), st = statusOf(c), cc = costs(c);
  const pct = s.match===null ? "—" : Math.round(s.match*100)+"%";

  let html = `<div class="card sect"><div class="scorebox">
      ${ring(s.match)}
      <div>${chip(st)||'<span class="tiny">Add an address to get a status</span>'}</div>
      <div class="kv">Points<b>${s.earned.toFixed(1)} / ${s.avail.toFixed(1)}</b></div>
      <div class="kv">Data filled<b>${Math.round(s.filled*100)}%</b></div>
      <div class="kv">Monthly<b>${money(cc.total)}</b></div>
      <div class="kv">Per m²<b>${cc.persqm===null?"—":cc.persqm.toFixed(1)+" zł"}</b></div>
      <div class="kv">Yearly<b style="${cc.headroom<0?'color:var(--bad)':''}">${money(cc.yearly)}</b></div>
      <div class="kv">Headroom<b style="${cc.headroom<0?'color:var(--bad)':''}">${money(cc.headroom)}</b></div>
      <div style="flex:1"></div>
      <button class="btn sm danger" id="bDel">Delete</button></div>`;
  const budgetCrit = liveCriteria().find(x=>x.kind==="budget");
  if(cc.headroom!==null && cc.headroom<0 && budgetCrit){
    const bf = frac(c, budgetCrit) ?? 0;
    html += `<div class="why"><span class="lost">Over budget by ${money(Math.abs(cc.headroom))}
      — scoring ${Math.round(bf*100)}% of the ${budgetCrit.weight} budget points,
      costing ${(budgetCrit.weight*(1-bf)).toFixed(1)}</span></div>`;
  }
  if(s.lost.length) html += `<div class="why">Losing most points to:
    ${s.lost.map(l=>`<span class="lost">${esc(l.n)} −${l.pts}</span>`).join("")}</div>`;
  if(s.match!==null && s.filled < P().minData)
    html += `<div class="why"><span>Only ${Math.round(s.filled*100)}% answered, so this stays
      “Incomplete” — ${pct} off that little says almost nothing.</span></div>`;
  html += `</div>`;

  html += travelPanel(c);

  html += `<div class="card sect"><h3 style="--acc:#7a8494">Photos
    <span style="font-weight:400;text-transform:none;letter-spacing:0;opacity:.75">
    ${c.photos&&c.photos.length ? c.photos.length+" from the listing" : "none saved"}</span>
    </h3><div class="gal">`;
  html += (c.photos&&c.photos.length)
    ? c.photos.map(u=>`<img src="${esc(u)}" loading="lazy" alt="" onerror="this.replaceWith(
        Object.assign(document.createElement('div'),{className:'ph',textContent:'image blocked'}))">`).join("")
    : `<div class="ph">No photos saved.</div>`;
  html += `</div>${c.link?`<div class="why"><a href="${esc(c.link)}" target="_blank"
    rel="noopener">Open the listing ↗</a></div>`:""}</div>`;

  for(const g of groups())
    html += `<div class="card sect"><h3 style="--acc:${g.color}">${esc(g.title)}</h3>
      <div class="body">${g.fields.map(f=>field(c,f)).join("")}</div></div>`;
  $("#form").innerHTML = html;

  $("#form").querySelectorAll("input[data-k],select[data-k],textarea[data-k]").forEach(el=>{
    const write = () => {
      setAns(c, el.dataset.k, el.value);
      // these three are columns on the row, not answers — keep both in step
      if(["address","link","notes"].includes(el.dataset.k)) c[el.dataset.k] = el.value;
    };
    el.addEventListener("input", ()=>{ write(); touch(c); save(c); renderList(); refreshBox(); });
    el.addEventListener("change",()=>{ write(); touch(c); save(c); render(); });
  });
  $("#form").querySelectorAll("input[data-pl]").forEach(el=>{
    const upd = () => {
      c.travel = c.travel||{}; c.travel[el.dataset.pl] = c.travel[el.dataset.pl]||{};
      const n = el.value==="" ? null : Number(el.value);
      if(n===null) delete c.travel[el.dataset.pl][el.dataset.mo];
      else c.travel[el.dataset.pl][el.dataset.mo] = n;
      touch(c); save(c);
    };
    el.addEventListener("input", ()=>{ upd(); renderList(); refreshBox(); });
    el.addEventListener("change",()=>{ upd(); render(); });
  });
  $("#form").querySelectorAll(".seg,.rate").forEach(box=>{
    box.querySelectorAll("button").forEach(b=>{
      b.onclick = () => { setAns(c, box.dataset.k, b.dataset.v); touch(c); save(c); render(); };
    });
  });
  $("#bDel").onclick = () => { if(!confirm("Delete this candidate?")) return;
    removeCandidate(c); };
  const bc = $("#bCalc"); if(bc) bc.onclick = () => calcTravel(c);
  $("#form").querySelectorAll(".gal img").forEach(im=>{
    im.onclick = () => { $("#lbImg").src = im.src; $("#lb").style.display="flex"; };
  });
  buildPrint(c);
}

function refreshBox(){
  const c = S.candidates.find(x=>x.id===selId); if(!c) return;
  const s = score(c), cc = costs(c), box = $(".scorebox"); if(!box) return;
  const col = scoreColor(s.match), C = 2*Math.PI*31;
  const rt = box.querySelector(".rt"), rp = box.querySelector(".rp");
  if(rt){ rt.textContent = s.match===null?"—":Math.round(s.match*100)+"%"; rt.style.color = col; }
  if(rp){ rp.setAttribute("stroke", col);
          rp.setAttribute("stroke-dashoffset", C*(1-(s.match||0))); }
  const b = box.querySelectorAll(".kv b");
  b[0].textContent = s.earned.toFixed(1)+" / "+s.avail.toFixed(1);
  b[1].textContent = Math.round(s.filled*100)+"%";
  b[2].textContent = money(cc.total);
  b[3].textContent = cc.persqm===null?"—":cc.persqm.toFixed(1)+" zł";
  b[4].textContent = money(cc.yearly);
  b[5].textContent = money(cc.headroom);
  const bad = cc.headroom!==null && cc.headroom<0 ? "var(--bad)" : "";
  b[4].style.color = bad; b[5].style.color = bad;
  const cf = $("#form").querySelectorAll(".f.calc input");
  const vals = [cc.total, cc.persqm, cc.yearly, cc.headroom];
  cf.forEach((inp,i)=>{ const v = vals[i];
    inp.value = v===null?"—":(i===1 ? v.toFixed(1)+" zł/m²" : money(v));
    inp.style.color = (i===3 && v!==null && v<0) ? "var(--bad)" : ""; });
}
function render(){
  renderList(); renderForm();
  const c = S.candidates.find(x=>x.id===selId);
  if(c && MAP.ready) focusCandidate(c);
  renderLegend();
}

/* ================================================================ print */
function buildPrint(c){
  if(!c){ $("#printSheet").innerHTML = ""; return; }
  const cc = costs(c);
  const row = (l,v) => `<div class="ps-row"><span class="l">${esc(l)}</span>
    <span class="v">${v===undefined?"":esc(v)}</span></div>`;
  const blank = l => `<div class="ps-row"><span class="l">${esc(l)}</span>
    <span class="v">____________________</span></div>`;
  let h = `<div class="ps-h">
    <h2>${esc(c.address || "Viewing sheet")}</h2>
    <div class="m">${esc(c.link||"")} · viewing ${esc((ans(c,"presdate")||"").replace("T"," "))||"date: ____________"}
      · ${money(cc.total)}/mo${cc.persqm!==null?" · "+cc.persqm.toFixed(1)+" zł/m²":""}
      · ${money(cc.yearly)}/yr</div></div>`;

  h += `<div class="ps-g"><h4>Known before the viewing</h4>` +
    row("Rent / czynsz / media",
        `${money(ans(c,"rent"))} / ${money(ans(c,"admin"))} / ${money(ans(c,"util"))}`) +
    row("Kaucja / provision", `${money(ans(c,"kaucja"))} / ${money(ans(c,"provision"))}`) +
    row("Area", ans(c,"area") ? ans(c,"area")+" m²" : "—") +
    row("Available from", ans(c,"availfrom") || "NOT STATED — ask") + `</div>`;

  h += `<div class="ps-g"><h4>Travel (minutes)</h4>`;
  for(const p of livePlaces()) for(const m of (p.modes||[]))
    h += row(`${p.name} — ${MODES[m.mode]}`, travelMins(c,p,m) ?? "—");
  h += `</div>`;

  h += `<div class="ps-g"><h4>Check yourself</h4><div class="ps-two">`;
  h += SELF_Q.map(q=>`<div class="ps-q">☐ ${esc(q)}</div>`).join("");
  h += `</div></div><div class="ps-g"><h4>Rate on the spot (0–3)</h4><div class="ps-two">`;
  h += liveCriteria().filter(x=>x.kind==="r3").map(x=>x.label)
        .map(l=>`<div class="ps-q">${esc(l)} &nbsp; 0 ☐ &nbsp; 1 ☐ &nbsp; 2 ☐ &nbsp; 3 ☐</div>`).join("");
  const custom = liveCriteria().filter(x=>x.builtin === false);
  if(custom.length){
    h += `</div></div><div class="ps-g"><h4>Your own criteria</h4><div class="ps-two">`;
    h += custom.map(x=>`<div class="ps-q">☐ ${esc(x.label)}${
      x.hint?` <span style="color:#777">— ${esc(x.hint)}</span>`:""}</div>`).join("");
  }
  h += `</div></div><div class="ps-g"><h4>Ask the owner</h4>`;
  h += OWNER_Q.map(q=>`<div class="ps-q">☐ ${esc(q)} <span style="color:#999">
    ......................................</span></div>`).join("");
  h += `</div><div class="ps-g"><h4>Notes</h4><div class="ps-notes"></div></div>`;
  $("#printSheet").innerHTML = h;
}
$("#bPrint").onclick = () => {
  if(!S.candidates.find(x=>x.id===selId)) return alert("Pick a candidate to print first.");
  window.print();
};

/* ================================================================ dialogs */
function dialog(title, bodyHtml, buttons){
  $("#dlgH").textContent = title; $("#dlgB").innerHTML = bodyHtml; $("#dlgF").innerHTML = "";
  buttons.forEach(b=>{ const el = document.createElement("button");
    el.className = "btn "+(b.primary?"primary":""); el.textContent = b.label;
    el.onclick = () => { if(b.act) b.act(); if(b.close!==false) $("#dlg").close(); };
    $("#dlgF").appendChild(el); });
  $("#dlg").showModal();
}
$("#bNew").onclick = () => { const c = {id:uid(), added:Date.now(), photos:[], travel:{}};
  touch(c); S.candidates.unshift(c); selId = c.id; save(c); render();
  setTimeout(()=>$("#form").querySelector('input[data-k="address"]')?.focus(), 30); };

/* ---------------------------------------------------------- admin panel
   Everything that used to live behind the Places and Weights buttons, plus
   full control of categories and criteria. Writes go straight to the API;
   nothing is editable while offline, because a local edit could not be
   reconciled against a database it never saw.                              */
let ADMIN = {tab:"criteria", openCat:null};

function importanceChip(imp){
  const m = {must:["#fdeae3","#8a2b00","Must"], important:["#fff4d9","#7a5a00","Important"],
             nice:["#eef4fb","#1f4e79","Nice"], none:["#f1f4f7","#69737f","Not scored"]};
  const [bg,fg,label] = m[imp] || m.none;
  return `<span class="chip" style="background:${bg};color:${fg}">${label}</span>`;
}

function openAdmin(tab){
  if(!ONLINE){
    if(LAST_ERROR) return showSyncProblem();
    return dialog("Admin unavailable", `<div class="note warn">
      Not connected to the server yet — sign in first. The schema lives in the
      database, so there is nothing to edit until it loads.</div>`,
      [{label:"Close", primary:true}]);
  }
  ADMIN.tab = tab || ADMIN.tab;
  dialog("Admin", adminBody(), [{label:"Done", primary:true, act(){ render(); }}]);
  wireAdmin();
}
function adminBody(){
  const tabs = [["criteria","Criteria"],["places","Places"],["settings","Scoring rules"]];
  let h = `<div class="tabs">${tabs.map(([k,l])=>
    `<button class="tab ${ADMIN.tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if(ADMIN.tab === "criteria") h += adminCriteria();
  if(ADMIN.tab === "places")   h += adminPlaces();
  if(ADMIN.tab === "settings") h += adminSettings();
  return h;
}

/* --- criteria & categories ----------------------------------------------- */
function adminCriteria(){
  const total = scoredCriteria().reduce((a,c)=>a+c.weight,0)
              + livePlaces().reduce((a,p)=>a+(p.modes||[]).reduce((x,m)=>x+modeWeight(p,m),0),0);
  let h = `<div class="note">Weight comes from the importance you pick — must 5,
    important 3, nice 1 — unless you set a number yourself. Total across
    everything scored right now: <b>${total.toFixed(1)}</b>. Only the ratio
    matters, not the absolute size.</div>`;

  for(const cat of SCHEMA.categories.filter(c=>!c.archived).sort((a,b)=>a.sort-b.sort)){
    const kids = SCHEMA.criteria.filter(c=>c.category_key===cat.key && !c.archived)
                                .sort((a,b)=>a.sort-b.sort);
    const catW = kids.filter(k=>k.scored).reduce((a,k)=>a+k.weight,0);
    h += `<div class="adcat">
      <div class="adcat-h" data-cat="${esc(cat.key)}">
        <span class="swatch" style="background:${esc(cat.color)}"></span>
        <b>${esc(cat.title)}</b>
        <span class="tiny">${kids.length} criteria · weight ${catW.toFixed(1)}</span>
        <div style="flex:1"></div>
        <button class="btn sm" data-editcat="${cat.id}">Edit</button>
        <button class="btn sm danger" data-delcat="${cat.id}">Archive</button>
      </div>
      <div class="adcat-b">`;
    for(const c of kids){
      h += `<div class="adrow" data-crit="${c.id}">
        <span class="adlabel">${esc(c.label)}
          ${c.builtin?"":`<span class="tiny" style="color:#9aa5b1">custom</span>`}</span>
        <span class="tiny mono">${esc(c.kind)}</span>
        ${importanceChip(c.importance)}
        <span class="wcell">${c.scored ? c.weight : "—"}</span>
        <button class="btn sm" data-editcrit="${c.id}">Edit</button>
        <button class="btn sm danger" data-delcrit="${c.id}">Archive</button>
      </div>`;
    }
    h += `<button class="btn sm" data-addcrit="${esc(cat.key)}"
            style="margin:8px">+ criterion</button></div></div>`;
  }
  const archived = SCHEMA.criteria.filter(c=>c.archived);
  if(archived.length) h += `<div class="note" style="margin-top:12px">
    ${archived.length} archived — hidden from the form and not scored, but every
    answer already recorded against them is still stored.
    ${archived.map(c=>`<button class="btn sm" data-unarch="${c.id}"
      style="margin:3px 3px 0 0">${esc(c.label)} ↩</button>`).join("")}</div>`;
  h += `<button class="btn" id="addCat" style="margin-top:12px">+ category</button>`;
  return h;
}

function critForm(c, catKey){
  const kinds = [["yesno","Yes / No"],["r3","Rating 0–3"],["num","Number"],
                 ["enum","Pick from a list"],["distance","Minutes away"],
                 ["date","Date"],["text","Text"],["textarea","Long text"]];
  const imps = [["must","Must have"],["important","Important"],["nice","Nice to have"],
                ["none","Not scored"]];
  return `
    <div class="f"><label>Label</label>
      <input id="cfLabel" value="${esc(c?.label||"")}" placeholder="Balcony faces the courtyard"></div>
    <div class="f" style="margin-top:9px"><label>Hint shown under the field, and given to the scraper</label>
      <input id="cfHint" value="${esc(c?.hint||"")}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px">
      <div class="f"><label>Type</label><select id="cfKind" ${c?.builtin?"disabled":""}>
        ${kinds.map(([k,l])=>`<option value="${k}" ${c?.kind===k?"selected":""}>${l}</option>`).join("")}
      </select>${c?.builtin?`<div class="hint">Built-in — type is fixed so recorded answers stay valid.</div>`:""}</div>
      <div class="f"><label>Importance</label><select id="cfImp">
        ${imps.map(([k,l])=>`<option value="${k}" ${c?.importance===k?"selected":""}>${l}</option>`).join("")}
      </select></div>
    </div>
    <div class="f" style="margin-top:9px">
      <label><input type="checkbox" id="cfCustomW" ${c?.weight_override!=null?"checked":""}
        style="width:auto;margin-right:6px">Set the weight myself</label>
      <input type="number" id="cfWeight" step="0.5" min="0"
        value="${c?.weight_override ?? ""}" placeholder="derived from importance"
        style="${c?.weight_override!=null?"":"display:none"}"></div>
    <div class="f" id="cfOptWrap" style="margin-top:9px;${c?.kind==="enum"?"":"display:none"}">
      <label>Choices, one per line, as <code>label = points</code></label>
      <textarea id="cfOpts" rows="5" placeholder="Lidl = 5&#10;Biedronka = 2">${
        esc((c?.options||[]).map(o=>`${o.value} = ${o.points}`).join("\n"))}</textarea>
      <div class="hint">Highest points scores full marks; the rest scale against it.</div></div>
    <div class="f" id="cfDistWrap" style="margin-top:9px;${c?.kind==="distance"?"":"display:none"}">
      <label>Minutes: full marks at / nothing at</label>
      <div style="display:flex;gap:6px">
        <input type="number" id="cfFull" value="${c?.config?.full ?? 5}">
        <input type="number" id="cfZero" value="${c?.config?.zero ?? 20}"></div></div>
    <div class="f" style="margin-top:9px">
      <label><input type="checkbox" id="cfPhoto" ${c?.photo_evidence?"checked":""}
        style="width:auto;margin-right:6px">A photograph can answer this</label>
      <div class="hint">Only tick when it is genuinely visible. The vision pass is
        never offered fields it cannot see, because it will answer anyway.</div></div>
    <div class="f" style="margin-top:6px">
      <label><input type="checkbox" id="cfScrape" ${c?(c.scrapable?"checked":""):"checked"}
        style="width:auto;margin-right:6px">Ask the scraper for it</label></div>
    <input type="hidden" id="cfCat" value="${esc(catKey || c?.category_key || "")}">`;
}

function readCritForm(){
  const kind = $("#cfKind").value;
  const body = {
    label: $("#cfLabel").value.trim(),
    hint: $("#cfHint").value.trim() || null,
    kind, importance: $("#cfImp").value,
    weight_override: $("#cfCustomW").checked ? (Number($("#cfWeight").value)||0) : null,
    category_key: $("#cfCat").value || null,
    scored: $("#cfImp").value !== "none",
    photo_evidence: $("#cfPhoto").checked,
    scrapable: $("#cfScrape").checked,
    options: null, config: null,
  };
  if(kind === "enum"){
    body.options = $("#cfOpts").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const m = l.split("=");
      return {value: m[0].trim(), points: Number((m[1]||"1").trim()) || 0};
    }).filter(o=>o.value);
  }
  if(kind === "distance")
    body.config = {full: Number($("#cfFull").value)||0, zero: Number($("#cfZero").value)||1};
  return body;
}

function wireCritForm(){
  const sync = () => {
    const k = $("#cfKind").value;
    $("#cfOptWrap").style.display  = k === "enum" ? "" : "none";
    $("#cfDistWrap").style.display = k === "distance" ? "" : "none";
  };
  $("#cfKind").onchange = sync;
  $("#cfCustomW").onchange = () => {
    $("#cfWeight").style.display = $("#cfCustomW").checked ? "" : "none";
  };
  sync();
}

function wireAdmin(){
  const B = $("#dlgB");
  B.querySelectorAll(".tab").forEach(t=>{
    t.onclick = () => { ADMIN.tab = t.dataset.tab; B.innerHTML = adminBody(); wireAdmin(); };
  });
  const reopen = () => { B.innerHTML = adminBody(); wireAdmin(); };

  B.querySelectorAll("[data-addcrit]").forEach(b=> b.onclick = () => {
    const cat = b.dataset.addcrit;
    dialog("New criterion", critForm(null, cat), [
      {label:"Cancel", act:()=>openAdmin()},
      {label:"Create", primary:true, act: async () => {
        await apiSchema("POST", "/api/admin/criteria", readCritForm());
        await loadSchema(); openAdmin();
      }}]);
    wireCritForm();
  });
  B.querySelectorAll("[data-editcrit]").forEach(b=> b.onclick = () => {
    const c = SCHEMA.criteria.find(x=>x.id === +b.dataset.editcrit);
    dialog("Edit criterion", critForm(c), [
      {label:"Cancel", act:()=>openAdmin()},
      {label:"Save", primary:true, act: async () => {
        await apiSchema("PATCH", "/api/admin/criteria/"+c.id, readCritForm());
        await loadSchema(); openAdmin();
      }}]);
    wireCritForm();
  });
  B.querySelectorAll("[data-delcrit]").forEach(b=> b.onclick = async () => {
    const c = SCHEMA.criteria.find(x=>x.id === +b.dataset.delcrit);
    let used = null;
    try{ used = await api("/api/admin/usage/"+encodeURIComponent(c.key)); }catch(e){}
    const msg = used
      ? `<b>${used.candidates_with_value}</b> of ${used.candidates_total} candidates have an
         answer for this. Archiving hides it and stops it scoring — those answers stay
         stored and come back if you restore it.`
      : "Archiving hides it and stops it scoring. Recorded answers are kept.";
    dialog("Archive “"+c.label+"”?", `<div class="note">${msg}</div>`, [
      {label:"Cancel", act:()=>openAdmin()},
      {label:"Archive", primary:true, act: async () => {
        await apiSchema("DELETE", "/api/admin/criteria/"+c.id);
        await loadSchema(); openAdmin();
      }}]);
  });
  B.querySelectorAll("[data-unarch]").forEach(b=> b.onclick = async () => {
    const c = SCHEMA.criteria.find(x=>x.id === +b.dataset.unarch);
    await apiSchema("PATCH", "/api/admin/criteria/"+c.id, {
      label:c.label, hint:c.hint, kind:c.kind, importance:c.importance,
      weight_override:c.weight_override, category_key:c.category_key,
      scored:c.scored, photo_evidence:c.photo_evidence, scrapable:c.scrapable,
      options:c.options, config:c.config, archived:false});
    await loadSchema(); reopen();
  });

  const catForm = cat => `
    <div class="f"><label>Name</label><input id="ctTitle" value="${esc(cat?.title||"")}"></div>
    <div class="f" style="margin-top:9px"><label>Colour</label>
      <input type="color" id="ctColor" value="${esc(cat?.color||"#4d4d4d")}"
             style="height:38px;padding:3px"></div>`;

function adminPlaces(){
  let h = `<div class="note">Weight is how much a destination matters overall. Each
    mode's share splits that weight, so bike 0.7 and transit 0.3 means the bike time
    counts for more than twice as much.</div>`;
  for(const p of livePlaces()){
    h += `<div class="pe" data-place="${p.id}">
      <div class="r">
        <input type="text" data-pf="name" value="${esc(p.name)}" placeholder="Name">
        <input type="number" data-pf="weight" value="${p.weight}" min="0" step="0.5" title="Weight">
        <input type="number" data-pf="departHour" value="${p.departHour ?? ""}"
               step="0.5" min="0" max="23" placeholder="${P().departHour}" title="Leave at">
        <button class="btn sm danger" data-delplace="${p.id}">Remove</button>
      </div>
      <div class="r"><input type="text" data-pf="address" value="${esc(p.address||"")}"
        placeholder="Address"></div>
      ${(p.modes||[]).map((m,j)=>`<div class="r" data-mode="${j}" style="gap:5px">
        <select data-mf="mode" style="padding:5px;border:1px solid var(--line);border-radius:6px">
          ${Object.keys(MODES).map(k=>`<option value="${k}" ${m.mode===k?"selected":""}>${MODES[k]}</option>`).join("")}
        </select>
        <span class="tiny">share</span><input type="number" data-mf="share" value="${m.share}" step="0.1" min="0">
        <span class="tiny">full</span><input type="number" data-mf="full" value="${m.full}" min="0">
        <span class="tiny">zero</span><input type="number" data-mf="zero" value="${m.zero}" min="1">
        <button class="btn sm" data-delmode="${j}">✕</button></div>`).join("")}
      <div style="display:flex;gap:6px;align-items:center;margin-top:6px">
        <button class="btn sm" data-addmode="${p.id}">+ mode</button>
        <span class="tiny">${(p.modes||[]).map(m=>
          MODES[m.mode]+" "+modeWeight(p,m).toFixed(1)).join(" · ")}</span>
        <div style="flex:1"></div>
        <button class="btn sm primary" data-saveplace="${p.id}">Save</button>
      </div></div>`;
  }
  return h + `<button class="btn" id="addPlace" style="margin-top:10px">+ place</button>`;
}
function placePayload(el, p){
  const g = f => el.querySelector(`[data-pf="${f}"]`)?.value;
  const modes = [...el.querySelectorAll("[data-mode]")].map(mr=>({
    mode: mr.querySelector('[data-mf="mode"]').value,
    share: Number(mr.querySelector('[data-mf="share"]').value)||0,
    full: Number(mr.querySelector('[data-mf="full"]').value)||0,
    zero: Number(mr.querySelector('[data-mf="zero"]').value)||1,
  }));
  const addressChanged = (g("address")||"") !== (p.address||"");
  return {name:g("name"), address:g("address")||null,
          weight:Number(g("weight"))||0,
          depart_hour: g("departHour") === "" ? null : Number(g("departHour")),
          // a new address invalidates the old coordinates, so drop them and
          // let the next Calculate geocode it afresh
          lat: addressChanged ? null : p.lat, lon: addressChanged ? null : p.lon,
          modes};
}
async function savePlace(p){
  await apiSchema("PATCH", "/api/admin/places/"+p.id, {
    name:p.name, address:p.address, weight:p.weight, depart_hour:p.departHour,
    lat:p.lat, lon:p.lon, modes:p.modes});
}
function wireAdminPlaces(reopen){
  const B = $("#dlgB");
  B.querySelectorAll("[data-saveplace]").forEach(b=> b.onclick = async () => {
    const el = b.closest(".pe");
    const p = SCHEMA.places.find(x=>x.id === +b.dataset.saveplace);
    await apiSchema("PATCH","/api/admin/places/"+p.id, placePayload(el, p));
    await loadSchema(); MAP.routeSig = null; MAP.fitted = false; reopen();
  });
  B.querySelectorAll("[data-delplace]").forEach(b=> b.onclick = async () => {
    if(!confirm("Remove this place? Travel times already measured stay on each candidate.")) return;
    await apiSchema("DELETE","/api/admin/places/"+b.dataset.delplace);
    await loadSchema(); reopen();
  });
  B.querySelectorAll("[data-addmode]").forEach(b=> b.onclick = async () => {
    const p = SCHEMA.places.find(x=>x.id === +b.dataset.addmode);
    p.modes = (p.modes||[]).concat([{mode:"WALKING",share:0.3,full:15,zero:35}]);
    await savePlace(p); await loadSchema(); reopen();
  });
  B.querySelectorAll("[data-delmode]").forEach(b=> b.onclick = async () => {
    const el = b.closest(".pe");
    const p = SCHEMA.places.find(x=>x.id === +el.dataset.place);
    p.modes.splice(+b.dataset.delmode, 1);
    await savePlace(p); await loadSchema(); reopen();
  });
  const add = $("#addPlace");
  if(add) add.onclick = async () => {
    await apiSchema("POST","/api/admin/places", {name:"New place", weight:2,
      modes:[{mode:"BICYCLING",share:0.7,full:12,zero:30},
             {mode:"TRANSIT",share:0.3,full:18,zero:40}]});
    await loadSchema(); reopen();
  };
}

function toCSV(){
  const keys = liveCriteria().map(c=>c.key);
  const travCols = [];
  for(const p of livePlaces()) for(const m of (p.modes||[])) travCols.push([p,m]);
  const head = ["status","match_pct","monthly","per_sqm","yearly","headroom"]
    .concat(travCols.map(([p,m])=>`${p.name} (${MODES[m.mode]}) min`))
    .concat(keys.map(k=>labelOf(k)));
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines = [head.join(",")];
  for(const c of S.candidates){
    const s = score(c), cc = costs(c);
    lines.push([statusOf(c), s.match===null?"":Math.round(s.match*100), cc.total??"",
      cc.persqm===null?"":cc.persqm.toFixed(1), cc.yearly??"", cc.headroom??""]
      .concat(travCols.map(([p,m])=>travelMins(c,p,m) ?? ""))
      .concat(keys.map(k=>ans(c,k) ?? "")).map(q).join(","));
  }
  return lines.join("\n");
}
function dl(text,name,mime){ const a=document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

/* ================================================== Google Maps travel times
   The key is NOT in this file. It lives in your browser's local storage, so the
   page can be public without leaking it. Restrict it by HTTP referrer anyway. */
const GKEY = "apartment-hunter-gmaps-key";
const getKey = () => { try{ return (CFG.mapsApiKey||"") || localStorage.getItem(GKEY)
    || localStorage.getItem("krk-gmaps-key") || ""; }catch(e){ return CFG.mapsApiKey||""; } };
let mapsLoading = null, mapsAuthFailed = false;

/* ---- who is allowed to spend your Maps quota -----------------------------
   The key is in the page, so this is not a security boundary — anyone who
   loads the page can read it out. What it does do is stop a stray visitor
   from triggering map loads and route calls just by opening the URL, which
   is the realistic cost risk. The hard limits are the referrer restriction
   and per-API daily quota caps in Cloud Console. Set both.               */
function allowedEmails(){
  const raw = CFG.allowedEmails;
  const list = Array.isArray(raw) ? raw : String(raw||"").split(/[,\s]+/);
  return list.map(s=>String(s||"").trim().toLowerCase()).filter(Boolean);
}
function mapsAllowed(){
  if(!fbConf()) return true;                 // no auth configured: local use
  const list = allowedEmails();
  const email = (FB.email||"").toLowerCase();
  if(!FB.uid) return false;                  // must be signed in
  return list.length === 0 ? true : list.includes(email);
}
function mapsGateReason(){
  if(mapsAllowed()) return null;
  if(!FB.uid) return "Sign in to load the map. It is kept behind sign-in so that "
                   + "opening this page does not spend the owner's Maps quota.";
  return "This account is not on the allow list for maps.";
}
/* Google calls this global when the key is rejected — otherwise the only clue
   is a console message and a grey box, which is a miserable way to find out. */
window.gm_authFailure = function(){
  mapsAuthFailed = true;
  const host = $("#mapBox");
  const origin = location.origin + (location.origin.endsWith("/") ? "" : "/") + "*";
  const msg = `Google rejected the Maps key for this address.<br><br>
    Add <code>${esc(origin)}</code> to the key's<br>
    <b>Application restrictions → Websites</b> list in Google Cloud Console,
    then wait a few minutes and reload.`;
  if(host) host.innerHTML = `<div class="empty" style="line-height:1.7">${msg}</div>`;
  setSync("err","maps key rejected");
};
function loadMaps(key){
  if(window.google?.maps?.importLibrary) return Promise.resolve();
  if(mapsLoading) return mapsLoading;
  mapsLoading = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&v=weekly";
    s.async = true;
    s.onload = res;
    s.onerror = () => rej(new Error("Google Maps would not load — check the key, that Maps "+
      "JavaScript API and Routes API are enabled, and the referrer restrictions."));
    document.head.appendChild(s);
  });
  return mapsLoading;
}
async function geocode(address){
  const {Geocoder} = await google.maps.importLibrary("geocoding");
  const r = await new Geocoder().geocode({address, region:P().region||"pl"});
  if(!r.results?.length) throw new Error("could not find “"+address+"” on the map");
  const l = r.results[0].geometry.location;
  return {lat:l.lat(), lng:l.lng()};
}
/* Routes library first (DistanceMatrixService was deprecated in Feb 2026);
   fall back to the legacy service, which still works, if the new one is absent. */
async function minutesBetween(from, to, mode, place){
  try{
    const {RouteMatrix} = await google.maps.importLibrary("routes");
    if(RouteMatrix?.computeRouteMatrix){
      const {UnitSystem} = await google.maps.importLibrary("core");
      const resp = await RouteMatrix.computeRouteMatrix({
        origins:[{lat:from.lat, lng:from.lng}], destinations:[{lat:to.lat, lng:to.lng}],
        travelMode: mode, units: UnitSystem.METRIC,
        fields:["distanceMeters","durationMillis","condition"]});
      const els = []; for await (const e of (resp[Symbol.asyncIterator] ? resp : [])) els.push(e);
      const list = els.length ? els : (Array.isArray(resp) ? resp : resp?.elements || []);
      const ms = list[0]?.durationMillis ?? list[0]?.duration?.value*1000;
      if(ms) return Math.round(ms/60000);
    }
  }catch(e){ console.warn("RouteMatrix failed, falling back", e); }
  const {DistanceMatrixService} = await google.maps.importLibrary("routes");
  const r = await new DistanceMatrixService().getDistanceMatrix(Object.assign({
    origins:[from], destinations:[to], travelMode:mode, unitSystem:0},
    routeOpts(place, mode)));
  const el = r.rows?.[0]?.elements?.[0];
  if(!el || el.status!=="OK") throw new Error("no route for "+MODES[mode]+" ("+(el?.status||"?")+")");
  return Math.round(el.duration.value/60);
}

async function calcTravel(c){
  const gate = mapsGateReason();
  if(gate){ alert(gate); return; }
  let key = getKey();
  if(!key){
    dialog("Google Maps key", `
      <div class="note">Travel times need a Google Maps Platform key with <b>Maps JavaScript API</b>,
      <b>Geocoding API</b> and <b>Routes API</b> enabled.</div>
      <div class="note warn">Restrict the key by HTTP referrer to your GitHub Pages domain before you
      use it. This page is public; an unrestricted key can be copied and billed to you. The key is
      stored only in this browser, never written into the page.</div>
      <div class="f"><label>API key</label><input id="gk" type="password" placeholder="AIza..."></div>`,
      [{label:"Cancel"},{label:"Save & calculate", primary:true, act(){
          const v = $("#gk").value.trim(); if(!v) return;
          try{ localStorage.setItem(GKEY, v); }catch(e){}
          calcTravel(c); }}]);
    return;
  }
  const btn = $("#bCalc"); const say = t => { if(btn) btn.textContent = t; };
  try{
    say("loading…"); await loadMaps(key);
    if(!c.lat || !c.lon){
      if(!c.address) throw new Error("give the flat an address first");
      say("geocoding…"); const city = (P().city||"").trim();
      const needsCity = city && !new RegExp(city.slice(0,4),"i").test(c.address);
      const g = await geocode(c.address + (needsCity ? ", "+city : ""));
      c.lat = g.lat; c.lon = g.lng; touch(c); save(c);
    }
    c.travel = c.travel || {};
    const fails = [];
    for(const p of livePlaces()){
      if(!p.lat || !p.lon){
        if(!p.address){ fails.push(p.name+": no address"); continue; }
        const g = await geocode(p.address); p.lat = g.lat; p.lon = g.lng;
        await savePlace(p);
      }
      c.travel[p.key] = c.travel[p.key] || {};
      for(const m of p.modes){
        say(p.name+" · "+MODES[m.mode]+"…");
        try{
          c.travel[p.key][m.mode] = await minutesBetween(
            {lat:c.lat,lng:c.lon}, {lat:p.lat,lng:p.lon}, m.mode, p);
          touch(c); save(c);
        }catch(e){ fails.push(`${p.name} by ${MODES[m.mode]}: ${e.message}`); }
      }
    }
    touch(c); save(c);
    MAP.routeSig = null; MAP.fitted = false;
    if(MAP.ready) await syncPins();
    render();
    if(fails.length) alert("Some legs could not be routed:\n\n• " + fails.join("\n• ") +
      "\n\nGoogle does not offer every mode in every city; type those in by hand.");
  }catch(e){
    say("Calculate");
    alert(mapsAuthFailed
      ? "Google rejected the Maps key for " + location.origin + ".\n\n" +
        "Add " + location.origin + "/* to the key's Application restrictions → Websites " +
        "list in Google Cloud Console, wait a few minutes, then reload."
      : "Travel times failed:\n\n" + e.message);
  }
}

async function doFetch(){
  const url = $("#urlIn").value.trim(), msg = $("#fetchMsg");
  if(!url){ msg.textContent = "Paste a URL first."; return; }
  msg.textContent = "Opening in Chrome…";
  try{
    const ctx = await callTool("mcp__claude-in-chrome__tabs_context_mcp",{createIfEmpty:true});
    const tabId = (ctx.availableTabs||[])[0]?.tabId;
    if(!tabId) throw new Error("no Chrome tab");
    await callTool("mcp__claude-in-chrome__navigate",{tabId,url});
    msg.textContent = "Reading…";
    const out = await callTool("mcp__claude-in-chrome__javascript_tool",
      {action:"javascript_exec", tabId, text:EXTRACTOR});
    const data = typeof out==="string" ? JSON.parse(out) : out;
    const c = Object.assign({id:uid(),added:Date.now(),photos:[],travel:{}}, data, {link:url});
    S.candidates.unshift(c); selId = c.id; save(c); render();
    msg.textContent = "Added."; setTimeout(()=>$("#dlg").close(), 800);
  }catch(e){ msg.innerHTML = `<span style="color:var(--bad)">Failed: ${esc(e.message)}</span>`; }
}
async function callTool(name,args){
  const r = await window.cowork.callMcpTool(name,args);
  if(r.isError) throw new Error(r.content?.[0]?.text || "tool error");
  if(r.structuredContent) return r.structuredContent;
  const t = r.content?.[0]?.text ?? "";
  try{ return JSON.parse(t); }catch(e){ return t; }
}
